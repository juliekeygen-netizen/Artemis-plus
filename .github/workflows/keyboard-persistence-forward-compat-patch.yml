name: Keyboard persistence forward compatibility patch

on:
  push:
    branches:
      - fix/keyboard-persistence-corruption

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[forward-compat-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Preserve unknown fields while repairing damaged siblings
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target block, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          root = Path('.')
          profiles = root / 'app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesManager.java'
          combos = root / 'app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyComboManager.java'

          old_profiles = '''    private static List<Profile> readProfiles(Context context) {\n        SharedPreferences metadata = meta(context);\n        String serialized = SafePreferenceValues.getString(metadata, KEY_PROFILES, "[]");\n        List<Profile> profiles = new ArrayList<>();\n        JSONArray array;\n        try {\n            array = new JSONArray(serialized);\n        } catch (JSONException ignored) {\n            return profiles;\n        }\n\n        boolean corruptedEntry = false;\n        for (int i = 0; i < array.length(); i++) {\n            Object value = array.opt(i);\n            if (!(value instanceof JSONObject)) {\n                corruptedEntry = true;\n                continue;\n            }\n            try {\n                Profile profile = Profile.fromJson((JSONObject) value);\n                if (profile.id.isEmpty() || profile.storageName.isEmpty() || findById(profiles, profile.id) != null) {\n                    corruptedEntry = true;\n                    continue;\n                }\n                profiles.add(profile);\n            } catch (JSONException ignored) {\n                corruptedEntry = true;\n            }\n        }\n\n        // Keep valid siblings instead of allowing one bad entry to orphan every profile layout.\n        if (corruptedEntry && !profiles.isEmpty()) {\n            writeProfiles(context, profiles, readActiveId(context, profiles.get(0).id));\n        }\n        return profiles;\n    }'''
          new_profiles = '''    private static List<Profile> readProfiles(Context context) {\n        SharedPreferences metadata = meta(context);\n        String serialized = SafePreferenceValues.getString(metadata, KEY_PROFILES, "[]");\n        List<Profile> profiles = new ArrayList<>();\n        JSONArray array;\n        try {\n            array = new JSONArray(serialized);\n        } catch (JSONException ignored) {\n            return profiles;\n        }\n\n        JSONArray repairedArray = new JSONArray();\n        boolean corruptedEntry = false;\n        for (int i = 0; i < array.length(); i++) {\n            Object value = array.opt(i);\n            if (!(value instanceof JSONObject)) {\n                corruptedEntry = true;\n                continue;\n            }\n            JSONObject object = (JSONObject) value;\n            try {\n                Profile profile = Profile.fromJson(object);\n                if (profile.id.isEmpty() || profile.storageName.isEmpty() || findById(profiles, profile.id) != null) {\n                    corruptedEntry = true;\n                    continue;\n                }\n                profiles.add(profile);\n                // Keep the original object so fields added by newer clients survive older-client repair.\n                repairedArray.put(object);\n            } catch (JSONException ignored) {\n                corruptedEntry = true;\n            }\n        }\n\n        // Keep valid siblings while preserving any unknown fields on those valid metadata objects.\n        if (corruptedEntry && !profiles.isEmpty()) {\n            metadata.edit().putString(KEY_PROFILES, repairedArray.toString()).apply();\n        }\n        return profiles;\n    }'''
          replace_exact(profiles, old_profiles, new_profiles)

          old_combos = '''    static List<Definition> loadDefinitionsForLayout(Context context, String layout) {\n        SharedPreferences preferences = context.getSharedPreferences(PREFERENCES, Context.MODE_PRIVATE);\n        String serialized = SafePreferenceValues.getString(preferences, definitionsKey(layout), "[]");\n        List<Definition> definitions = new ArrayList<>();\n        JSONArray array;\n        try {\n            array = new JSONArray(serialized);\n        } catch (JSONException ignored) {\n            return definitions;\n        }\n\n        List<String> seenIds = new ArrayList<>();\n        boolean corruptedEntry = false;\n        for (int i = 0; i < array.length(); i++) {\n            Object value = array.opt(i);\n            if (!(value instanceof JSONObject)) {\n                corruptedEntry = true;\n                continue;\n            }\n            try {\n                Definition definition = Definition.fromJson((JSONObject) value);\n                if (definition.id.isEmpty() || definition.keys.length == 0 || seenIds.contains(definition.id)) {\n                    corruptedEntry = true;\n                    continue;\n                }\n                seenIds.add(definition.id);\n                definitions.add(definition);\n            } catch (JSONException ignored) {\n                corruptedEntry = true;\n            }\n        }\n\n        if (corruptedEntry) {\n            saveDefinitionsForLayout(context, layout, definitions);\n        }\n        return definitions;\n    }'''
          new_combos = '''    static List<Definition> loadDefinitionsForLayout(Context context, String layout) {\n        SharedPreferences preferences = context.getSharedPreferences(PREFERENCES, Context.MODE_PRIVATE);\n        String serialized = SafePreferenceValues.getString(preferences, definitionsKey(layout), "[]");\n        List<Definition> definitions = new ArrayList<>();\n        JSONArray array;\n        try {\n            array = new JSONArray(serialized);\n        } catch (JSONException ignored) {\n            return definitions;\n        }\n\n        List<String> seenIds = new ArrayList<>();\n        JSONArray repairedArray = new JSONArray();\n        boolean corruptedEntry = false;\n        for (int i = 0; i < array.length(); i++) {\n            Object value = array.opt(i);\n            if (!(value instanceof JSONObject)) {\n                corruptedEntry = true;\n                continue;\n            }\n            JSONObject object = (JSONObject) value;\n            try {\n                Definition definition = Definition.fromJson(object);\n                if (definition.id.isEmpty() || definition.keys.length == 0 || seenIds.contains(definition.id)) {\n                    corruptedEntry = true;\n                    continue;\n                }\n                seenIds.add(definition.id);\n                definitions.add(definition);\n                // Preserve fields unknown to this build when cleaning only the damaged siblings.\n                repairedArray.put(object);\n            } catch (JSONException ignored) {\n                corruptedEntry = true;\n            }\n        }\n\n        if (corruptedEntry) {\n            preferences.edit().putString(definitionsKey(layout), repairedArray.toString()).apply();\n        }\n        return definitions;\n    }'''
          replace_exact(combos, old_combos, new_combos)

      - name: Enforce minimal patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          expected=(
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyComboManager.java
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesManager.java
          )
          if [[ "$(printf '%s\n' "${changed[@]}" | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
            echo 'Unexpected forward-compat patch file set.' >&2
            exit 1
          fi
          total_changes="$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          if (( total_changes > 100 )); then
            echo "Forward-compat repair diff unexpectedly large (${total_changes} lines)." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Run corruption and compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac :app:testNonRoot_gameDebugUnitTest \
            --tests 'com.limelight.binding.input.virtual_controller.keyboard.KeyboardPersistenceCorruptionTest' \
            --tests 'com.limelight.binding.input.virtual_controller.keyboard.KeyboardProfilesManagerTest' \
            --tests 'com.limelight.binding.input.virtual_controller.keyboard.KeyComboManagerTest' \
            --tests 'com.limelight.binding.input.virtual_controller.keyboard.ArtemisActionButtonFactoryTest' \
            --stacktrace

      - name: Commit verified forward-compatible repair and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/keyboard-persistence-forward-compat-patch.yml
          git config user.name 'Artemis Plus Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyComboManager.java \
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesManager.java \
            .github/workflows/keyboard-persistence-forward-compat-patch.yml
          git diff --cached --check
          git commit -m 'Preserve future fields during persistence repair [forward-compat-bot]'
          git push origin HEAD:fix/keyboard-persistence-corruption
