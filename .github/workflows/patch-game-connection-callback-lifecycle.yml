name: Patch Game connection callback lifecycle

on:
  push:
    branches:
      - fix/game-connection-callback-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Serialize direct connection callbacks with Activity teardown
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/limelight/Game.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "    public void rumble(short controllerNumber, short lowFreqMotor, short highFreqMotor) {\n"
                  "        if (inputCallbacksDestroyed) {\n"
                  "            return;\n"
                  "        }\n"
                  "\n"
                  "        if (prefConfig.enableRumble) {\n"
                  "            LimeLog.info(String.format((Locale)null, \"Rumble on gamepad %d: %04x %04x\", controllerNumber, lowFreqMotor, highFreqMotor));\n"
                  "            controllerHandler.handleRumble(controllerNumber, lowFreqMotor, highFreqMotor);\n"
                  "        }\n"
                  "    }\n",
                  "    public void rumble(short controllerNumber, short lowFreqMotor, short highFreqMotor) {\n"
                  "        runOnUiThreadIfActive(() -> {\n"
                  "            if (prefConfig.enableRumble) {\n"
                  "                LimeLog.info(String.format((Locale)null, \"Rumble on gamepad %d: %04x %04x\", controllerNumber, lowFreqMotor, highFreqMotor));\n"
                  "                controllerHandler.handleRumble(controllerNumber, lowFreqMotor, highFreqMotor);\n"
                  "            }\n"
                  "        });\n"
                  "    }\n"
              ),
              (
                  "    public void rumbleTriggers(short controllerNumber, short leftTrigger, short rightTrigger) {\n"
                  "        if (inputCallbacksDestroyed) {\n"
                  "            return;\n"
                  "        }\n"
                  "\n"
                  "        LimeLog.info(String.format((Locale)null, \"Rumble on gamepad triggers %d: %04x %04x\", controllerNumber, leftTrigger, rightTrigger));\n"
                  "\n"
                  "        controllerHandler.handleRumbleTriggers(controllerNumber, leftTrigger, rightTrigger);\n"
                  "    }\n",
                  "    public void rumbleTriggers(short controllerNumber, short leftTrigger, short rightTrigger) {\n"
                  "        runOnUiThreadIfActive(() -> {\n"
                  "            LimeLog.info(String.format((Locale)null, \"Rumble on gamepad triggers %d: %04x %04x\", controllerNumber, leftTrigger, rightTrigger));\n"
                  "            controllerHandler.handleRumbleTriggers(controllerNumber, leftTrigger, rightTrigger);\n"
                  "        });\n"
                  "    }\n"
              ),
              (
                  "    public void setHdrMode(boolean enabled, byte[] hdrMetadata) {\n"
                  "        if (inputCallbacksDestroyed) {\n"
                  "            return;\n"
                  "        }\n"
                  "\n"
                  "        LimeLog.info(\"Display HDR mode: \" + (enabled ? \"enabled\" : \"disabled\"));\n"
                  "        decoderRenderer.setHdrMode(enabled, hdrMetadata);\n"
                  "    }\n",
                  "    public void setHdrMode(boolean enabled, byte[] hdrMetadata) {\n"
                  "        runOnUiThreadIfActive(() -> {\n"
                  "            LimeLog.info(\"Display HDR mode: \" + (enabled ? \"enabled\" : \"disabled\"));\n"
                  "            decoderRenderer.setHdrMode(enabled, hdrMetadata);\n"
                  "        });\n"
                  "    }\n"
              ),
              (
                  "    public void setMotionEventState(short controllerNumber, byte motionType, short reportRateHz) {\n"
                  "        if (inputCallbacksDestroyed) {\n"
                  "            return;\n"
                  "        }\n"
                  "\n"
                  "        controllerHandler.handleSetMotionEventState(controllerNumber, motionType, reportRateHz);\n"
                  "    }\n",
                  "    public void setMotionEventState(short controllerNumber, byte motionType, short reportRateHz) {\n"
                  "        runOnUiThreadIfActive(() ->\n"
                  "                controllerHandler.handleSetMotionEventState(controllerNumber, motionType, reportRateHz));\n"
                  "    }\n"
              ),
              (
                  "    public void setControllerLED(short controllerNumber, byte r, byte g, byte b) {\n"
                  "        if (inputCallbacksDestroyed) {\n"
                  "            return;\n"
                  "        }\n"
                  "\n"
                  "        controllerHandler.handleSetControllerLED(controllerNumber, r, g, b);\n"
                  "    }\n",
                  "    public void setControllerLED(short controllerNumber, byte r, byte g, byte b) {\n"
                  "        runOnUiThreadIfActive(() -> controllerHandler.handleSetControllerLED(controllerNumber, r, g, b));\n"
                  "    }\n"
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('Direct callback replacement marker mismatch')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit callback serialization patch
        run: |
          chmod +x app/src/main/java/com/limelight/Game.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/limelight/Game.java
          git diff --cached --check
          git commit -m "Serialize direct Game callbacks with teardown"
          git push
