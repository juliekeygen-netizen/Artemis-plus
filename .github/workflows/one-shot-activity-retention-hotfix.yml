name: One-shot activity retention hotfix

on:
  push:
    branches:
      - fix/background-stream-activity-retention

permissions:
  contents: write

jobs:
  verify-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/background-stream-activity-retention
          submodules: recursive
          fetch-depth: 0

      - name: Apply activity retention hotfix
        run: python3 .github/activity_retention_hotfix.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run retention and background regressions
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.GameActivityManifestTest"
          --tests "com.limelight.preferences.BackgroundStreamingPolicyTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.preferences.StreamSettingsFragmentLifecycleTest"
          --stacktrace

      - name: Commit verified hotfix
        run: |
          git config user.name "juliekeygen-netizen"
          git config user.email "julie.keygen@gmail.com"
          git add app/src/main/AndroidManifest.xml app/src/test/java/com/limelight/GameActivityManifestTest.java .github/workflows/android-ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix background stream Activity retention"
            git push origin HEAD:fix/background-stream-activity-retention
          fi
