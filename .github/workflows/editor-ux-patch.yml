name: One-shot Editor UX Patch

on:
  push:
    branches:
      - feature/keyboard-editor-ux-input-fix
    paths:
      - .github/workflows/editor-ux-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/keyboard-editor-ux-input-fix
          fetch-depth: 0

      - name: Apply final source cleanup
        shell: python
        run: |
          from pathlib import Path

          controller = Path("app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyBoardController.java")
          text = controller.read_text(encoding="utf-8")
          anchor = "        activeMoveGroup.clear();\n        for (keyBoardVirtualControllerElement element : new ArrayList<>(elements)) {"
          replacement = "        activeMoveGroup.clear();\n        outlinedGroup.clear();\n        for (keyBoardVirtualControllerElement element : new ArrayList<>(elements)) {"
          if anchor not in text:
              raise SystemExit("KeyBoardController cleanup anchor missing")
          controller.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          combos = Path("app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyComboManager.java")
          text = combos.read_text(encoding="utf-8")
          anchor = "        definitions.removeIf(definition -> definition.id.equals(id));"
          replacement = "        for (int i = definitions.size() - 1; i >= 0; i--) {\n            if (definitions.get(i).id.equals(id)) {\n                definitions.remove(i);\n            }\n        }"
          if anchor not in text:
              raise SystemExit("KeyComboManager cleanup anchor missing")
          combos.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyBoardController.java
          git add app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyComboManager.java
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: harden editor cleanup and key deletion"
          git push origin HEAD:feature/keyboard-editor-ux-input-fix
