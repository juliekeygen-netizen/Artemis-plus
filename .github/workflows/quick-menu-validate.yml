name: Quick Menu Validate

on:
  push:
    branches:
      - feature/customizable-quick-menu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Quick Menu audit patch
        run: python3 .github/quick_menu_patch.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Quick Menu branch
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run Quick Menu regressions
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.quickmenu.QuickMenuConfigTest"
          --tests "com.limelight.GameActivityManifestTest"
          --tests "com.limelight.preferences.BackgroundStreamingPolicyTest"
          --stacktrace

      - name: Commit validated product patch
        run: |
          if git diff --quiet; then
            echo "No product patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/limelight/GameMenu.java \
            app/src/main/java/com/limelight/quickmenu/QuickMenuConfig.java \
            app/src/main/java/com/limelight/quickmenu/QuickMenuEditorDialog.java \
            app/src/main/res/xml/preferences.xml
          git commit -m "Harden Quick Menu navigation and limits"
          git push
