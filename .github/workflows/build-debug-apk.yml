name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'audit/**'

permissions:
  contents: write

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build installable debug APKs
        run: ./gradlew :app:assembleNonRoot_gameDebug --stacktrace

      - name: Prepare download package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -path '*nonRoot_game*debug*' -print -exec cp '{}' dist/ \;

          if ! compgen -G 'dist/*.apk' > /dev/null; then
            echo 'No debug APKs were produced.' >&2
            exit 1
          fi

          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS.txt
          )

          cat > dist/INSTALL.txt <<'EOF'
          Artemis Plus debug APKs
          =======================

          These APKs are debug-signed and are intended for testing Artemis Plus.

          Choose the APK matching your Android device CPU:
          - arm64-v8a: almost all modern Android phones/tablets
          - armeabi-v7a: older 32-bit ARM devices
          - x86_64 / x86: mainly emulators or uncommon Intel Android devices

          Android may ask you to allow installs from your browser/file manager before installing.
          The debug build uses the project's debug application ID, so it can normally coexist with
          a regular Artemis installation rather than replacing it.
          EOF

          echo 'Produced APKs:'
          ls -lh dist/*.apk

      - name: Upload Artemis Plus APKs as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Plus-debug-APKs
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG='debug-latest'
          TITLE='Artemis Plus Debug (Latest)'
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"

          cat > release-notes.md <<EOF
          ## Artemis Plus latest debug build

          Automatically built from the current \`main\` branch.

          - Commit: \`${GITHUB_SHA}\`
          - Short commit: \`${SHORT_SHA}\`
          - Built: ${BUILT_AT}
          - Build type: non-root debug

          **Most modern Android phones/tablets should use the \`arm64-v8a\` APK.**

          These are debug-signed test builds. See \`INSTALL.txt\` for the CPU/ABI guide and \`SHA256SUMS.txt\` for checksums.
          EOF

          # Keep one stable download location instead of creating a release for every commit.
          # Remove the previous rolling release/tag if they exist, then recreate them at this commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          gh release create "$TAG" \
            dist/*.apk \
            dist/SHA256SUMS.txt \
            dist/INSTALL.txt \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
