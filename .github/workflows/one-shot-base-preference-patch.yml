name: One-shot base preference recovery patch

on:
  push:
    branches:
      - fix/base-preference-type-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'juliekeygen-netizen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: fix/base-preference-type-recovery

      - name: Apply exact source and regression edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager_path = Path('app/src/main/java/com/limelight/profiles/ProfilesManager.java')
          manager = manager_path.read_text(encoding='utf-8')
          old = '''        SharedPreferences base = androidx.preference.PreferenceManager.getDefaultSharedPreferences(context);
                  SettingsProfile active = getActive();
                  if (active == null || active.getOptions() == null) {
                      return base;
                  }
                  return new OverlaySharedPreferences(base, active.getOptions());'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''        SharedPreferences base = androidx.preference.PreferenceManager.getDefaultSharedPreferences(context);
                  SettingsProfile active = getActive();
                  Map<String, Object> patch = active == null || active.getOptions() == null
                          ? java.util.Collections.emptyMap()
                          : active.getOptions();
                  return new OverlaySharedPreferences(base, patch);'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          count = manager.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one base/overlay return block, found {count}')
          manager_path.write_text(manager.replace(old, new, 1), encoding='utf-8')

          test_path = Path('app/src/test/java/com/limelight/profiles/OverlayPreferencesTest.java')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''    /**
               * Verify that the overlay zoom toggle visibility and zoom\\pan remembering options
               * are persisted with the profile and correctly reloaded across sessions.
               */'''
          anchor = '\n'.join(line[5:] if line.startswith('     ') else line for line in anchor.splitlines())
          addition = '''    /**
               * The type-tolerant wrapper must also protect ordinary base preferences when no
               * settings profile is active. This is the common startup path for most users.
               */
              @Test
              public void overlayPref_InvalidBaseTypeFallsBackWithoutActiveProfile() {
                  SharedPreferences base = PreferenceManager.getDefaultSharedPreferences(ctx);
                  base.edit().putString("checkbox_enable_pip", "not-a-boolean").commit();
                  try {
                      ProfilesManager pm = ProfilesManager.getInstance();
                      SharedPreferences sp = pm.getOverlayingSharedPreferences(ctx);
                      assertFalse(sp.getBoolean("checkbox_enable_pip", false));

                      PreferenceConfiguration cfg = PreferenceConfiguration.readPreferences(ctx);
                      assertFalse(cfg.enablePip);
                  } finally {
                      base.edit().remove("checkbox_enable_pip").commit();
                  }
              }

          '''
          addition = '\n'.join(line[5:] if line.startswith('     ') else line for line in addition.splitlines())
          count = test.count(anchor)
          if count != 1:
              raise SystemExit(f'Expected exactly one overlay zoom test anchor, found {count}')
          test_path.write_text(test.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY

      - name: Commit patched source and regression
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/com/limelight/profiles/ProfilesManager.java app/src/test/java/com/limelight/profiles/OverlayPreferencesTest.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/limelight/profiles/ProfilesManager.java app/src/test/java/com/limelight/profiles/OverlayPreferencesTest.java
          git commit -m 'fix: protect base preference reads without profiles'
          git push origin HEAD:fix/base-preference-type-recovery
