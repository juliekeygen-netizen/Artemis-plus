name: One-shot UI v4 hardening

on:
  push:
    branches:
      - feature/ui-editor-system-v4
    paths:
      - '.github/workflows/one-shot-ui-v4-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ui-editor-system-v4
          fetch-depth: 0

      - name: Apply corrected lifecycle hardening
        run: python3 tools/one_shot_ui_v4_hardening.py

      - name: Commit hardening and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden UI editor lifecycle persistence"
          git push origin HEAD:feature/ui-editor-system-v4
