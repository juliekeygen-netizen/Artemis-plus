name: One-shot action catalog localization

on:
  push:
    branches:
      - staging/action-catalog-localization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-validated-blobs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: staging/action-catalog-localization
          fetch-depth: 0

      - name: Recreate already-validated localization diff
        run: |
          python3 .github/scripts/patch-action-catalog-localization.py
          python3 .github/scripts/patch-action-catalog-localization-followup.py
          git diff --check
          test -f app/src/main/res/values/artemis_action_catalog.xml
          test -f app/src/test/java/com/limelight/ArtemisCatalogLocalizationTest.java
          grep -q 'ui.getString(action.labelResId)' app/src/main/java/com/limelight/quickmenu/QuickMenuEditorDialog.java
          grep -q 'action.descriptionResId != 0' app/src/test/java/com/limelight/quickmenu/QuickMenuConfigTest.java

      - name: Publish validated non-workflow blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/limelight/ArtemisAction.java \
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/ArtemisActionButtonFactory.java \
            app/src/main/java/com/limelight/quickmenu/StreamActionRegistry.java \
            app/src/main/java/com/limelight/quickmenu/QuickMenuEditorDialog.java \
            app/src/main/res/values/artemis_action_catalog.xml \
            app/src/test/java/com/limelight/ArtemisCatalogLocalizationTest.java \
            app/src/test/java/com/limelight/quickmenu/QuickMenuConfigTest.java
          git commit -m "Stage validated action catalog localization blobs"
          git push origin HEAD:staging/action-catalog-localization
