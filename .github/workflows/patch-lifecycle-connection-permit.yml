name: Patch reconnect permit ownership

on:
  push:
    branches:
      - fix/lifecycle-reconnect-input-teardown-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run guarded reconnect permit repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lifecycle-reconnect-input-teardown-v2
          submodules: recursive
          fetch-depth: 0

      - name: Apply reconnect permit and callback corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          nv_path = Path('app/src/main/java/com/limelight/nvstream/NvConnection.java')
          nv_raw = nv_path.read_bytes()
          nv_uses_crlf = b'\r\n' in nv_raw
          nv = nv_raw.decode('utf-8').replace('\r\n', '\n')
          nv = replace_once(
              nv,
              'import java.util.concurrent.Semaphore;\n',
              'import java.util.concurrent.atomic.AtomicInteger;\n',
              'NvConnection concurrency import')
          nv = replace_once(
              nv,
              '    private static Semaphore connectionAllowed = new Semaphore(1);\n'
              '    private final boolean isMonkey;\n',
              '    private static final ConnectionPermitGate connectionPermitGate = new ConnectionPermitGate();\n'
              '    private final AtomicInteger startGeneration = new AtomicInteger();\n'
              '    private final boolean isMonkey;\n',
              'NvConnection permit fields')
          nv = replace_once(
              nv,
              '''    public void stop() {\n        // Interrupt any pending connection. This is thread-safe.\n        MoonBridge.interruptConnection();\n\n        // Moonlight-core is not thread-safe with respect to connection start and stop, so\n        // we must not invoke that functionality in parallel.\n        synchronized (MoonBridge.class) {\n            MoonBridge.stopConnection();\n            MoonBridge.cleanupBridge();\n        }\n\n        // Now a pending connection can be processed\n        connectionAllowed.release();\n    }\n''',
              '''    public void stop() {\n        // Invalidate pending/restarting Java start workers before touching native state.\n        startGeneration.incrementAndGet();\n\n        // Interrupt any pending native connection. This is thread-safe.\n        MoonBridge.interruptConnection();\n\n        // Moonlight-core is not thread-safe with respect to connection start and stop, so\n        // we must not invoke that functionality in parallel.\n        synchronized (MoonBridge.class) {\n            MoonBridge.stopConnection();\n            MoonBridge.cleanupBridge();\n        }\n\n        // Release only if this NvConnection actually owns the process-wide connection slot.\n        // A failed start and a concurrent stop may both reach this path; release is idempotent.\n        connectionPermitGate.release(this);\n    }\n''',
              'NvConnection stop ownership')

          start_begin = nv.index('    public void start(final AudioRenderer audioRenderer, final VideoDecoderRenderer videoDecoderRenderer, final NvConnectionListener connectionListener)')
          start_end = nv.index('    public void sendExecServerCmd', start_begin)
          new_start = '''    public Thread start(final AudioRenderer audioRenderer, final VideoDecoderRenderer videoDecoderRenderer, final NvConnectionListener connectionListener)\n    {\n        return startInternal(audioRenderer, videoDecoderRenderer, connectionListener, false);\n    }\n\n    /**\n     * Restart the native transport while retaining this NvConnection's existing global session\n     * permit. Smart reconnect uses this path after an unexpected transport termination.\n     */\n    public Thread restart(final AudioRenderer audioRenderer, final VideoDecoderRenderer videoDecoderRenderer, final NvConnectionListener connectionListener)\n    {\n        return startInternal(audioRenderer, videoDecoderRenderer, connectionListener, true);\n    }\n\n    private Thread startInternal(final AudioRenderer audioRenderer,\n                                 final VideoDecoderRenderer videoDecoderRenderer,\n                                 final NvConnectionListener connectionListener,\n                                 final boolean reuseExistingPermit)\n    {\n        final int generation = startGeneration.incrementAndGet();\n        Thread startThread = new Thread(new Runnable() {\n            public void run() {\n                context.connListener = connectionListener;\n                context.videoCapabilities = videoDecoderRenderer.getCapabilities();\n\n                String appName = context.streamConfig.getApp().getAppName();\n                if (!isStartGenerationCurrent(generation)) {\n                    return;\n                }\n\n                context.connListener.stageStarting(appName);\n\n                int tryCount = 0;\n\n                do {\n                    if (!isStartGenerationCurrent(generation)) {\n                        return;\n                    }\n                    boolean retry = false;\n                    try {\n                        if (!startApp()) {\n                            retry = context.connListener.stageFailed(appName, 0, 0);\n                            if (!retry) {\n                                return;\n                            }\n                        }\n                        context.connListener.stageComplete(appName);\n                    } catch (HostHttpResponseException e) {\n                        e.printStackTrace();\n                        context.connListener.displayMessage(e.getMessage());\n                        retry = context.connListener.stageFailed(appName, 0, e.getErrorCode());\n                        if (!retry) {\n                            return;\n                        }\n                    } catch (XmlPullParserException | IOException e) {\n                        e.printStackTrace();\n                        context.connListener.displayMessage(e.getMessage());\n                        retry = context.connListener.stageFailed(appName, MoonBridge.ML_PORT_FLAG_TCP_47984 | MoonBridge.ML_PORT_FLAG_TCP_47989, tryCount < 2 ? 0 : -408);\n                        if (!retry) {\n                            return;\n                        }\n                    }\n\n                    if (!retry) break;\n                    tryCount += 1;\n\n                    try {\n                        sleep(2000);\n                    } catch (InterruptedException e) {\n                        Thread.currentThread().interrupt();\n                        return;\n                    }\n                } while (tryCount < 5);\n\n                if (!isStartGenerationCurrent(generation)) {\n                    return;\n                }\n                if (tryCount >= 5) {\n                    context.connListener.stageFailed(appName, 0, -408);\n                    return;\n                }\n\n                ByteBuffer ib = ByteBuffer.allocate(16);\n                ib.putInt(context.riKeyId);\n\n                if (reuseExistingPermit) {\n                    if (!connectionPermitGate.canReuse(NvConnection.this)) {\n                        LimeLog.warning("Reconnect requested without retained connection ownership");\n                        context.connListener.stageFailed(appName, 0, 0);\n                        return;\n                    }\n                }\n                else {\n                    try {\n                        connectionPermitGate.acquire(NvConnection.this);\n                    } catch (InterruptedException e) {\n                        Thread.currentThread().interrupt();\n                        if (isStartGenerationCurrent(generation)) {\n                            context.connListener.stageFailed(appName, 0, 0);\n                        }\n                        return;\n                    } catch (IllegalStateException e) {\n                        LimeLog.warning(e.getMessage());\n                        if (isStartGenerationCurrent(generation)) {\n                            context.connListener.stageFailed(appName, 0, 0);\n                        }\n                        return;\n                    }\n                }\n\n                if (!isStartGenerationCurrent(generation)) {\n                    if (!reuseExistingPermit) {\n                        connectionPermitGate.release(NvConnection.this);\n                    }\n                    return;\n                }\n\n                // Moonlight-core is not thread-safe with respect to connection start and stop, so\n                // we must not invoke that functionality in parallel.\n                synchronized (MoonBridge.class) {\n                    if (!isStartGenerationCurrent(generation)) {\n                        if (!reuseExistingPermit) {\n                            connectionPermitGate.release(NvConnection.this);\n                        }\n                        return;\n                    }\n                    MoonBridge.setupBridge(videoDecoderRenderer, audioRenderer, connectionListener);\n                    int ret = MoonBridge.startConnection(context.serverAddress.address,\n                            context.serverAppVersion, context.serverGfeVersion, context.rtspSessionUrl,\n                            context.serverCodecModeSupport,\n                            context.negotiatedWidth, context.negotiatedHeight,\n                            context.streamConfig.getRefreshRate(), context.streamConfig.getBitrate(),\n                            context.negotiatedPacketSize, context.negotiatedRemoteStreaming,\n                            context.streamConfig.getAudioConfiguration().toInt(),\n                            context.streamConfig.getSupportedVideoFormats(),\n                            context.streamConfig.getClientRefreshRateX100(),\n                            context.riKey.getEncoded(), ib.array(),\n                            context.videoCapabilities,\n                            context.streamConfig.getColorSpace(),\n                            context.streamConfig.getColorRange());\n                    if (ret != 0) {\n                        // Ordinary failed starts never established a live session and release their\n                        // ownership. Smart reconnect retains the existing session permit so the\n                        // bounded retry owner can attempt the next transport without deadlocking.\n                        if (!reuseExistingPermit) {\n                            connectionPermitGate.release(NvConnection.this);\n                        }\n                        return;\n                    }\n                }\n            }\n        }, reuseExistingPermit ? "NvConnectionRestart" : "NvConnectionStart");\n        startThread.start();\n        return startThread;\n    }\n\n    private boolean isStartGenerationCurrent(int generation) {\n        return startGeneration.get() == generation;\n    }\n\n'''
          nv = nv[:start_begin] + new_start + nv[start_end:]
          if 'connectionAllowed' in nv:
              raise SystemExit('legacy connectionAllowed semaphore reference remains')
          nv_output = nv.replace('\n', '\r\n') if nv_uses_crlf else nv
          nv_path.write_bytes(nv_output.encode('utf-8'))

          game_path = Path('app/src/main/java/com/limelight/Game.java')
          game = game_path.read_text(encoding='utf-8')

          game = replace_once(
              game,
              '''        synchronized (smartReconnectFence) {\n            if (activityDestroyed || isFinishing() || !connecting) {\n                return false;\n            }\n            connecting = false;\n            connected = false;\n        }\n\n        runOnUiThread(new Runnable() {\n''',
              '''        final boolean smartReconnectStageFailure;\n        synchronized (smartReconnectFence) {\n            if (activityDestroyed || isFinishing() || !connecting) {\n                return false;\n            }\n            connecting = false;\n            connected = false;\n            smartReconnectStageFailure = smartReconnectFence.hasActiveAttempt();\n        }\n        if (smartReconnectStageFailure) {\n            LimeLog.info("Reconnect start stage failed; retry owner remains active");\n            return false;\n        }\n\n        runOnUiThread(new Runnable() {\n''',
              'silent smart reconnect stage failure')

          game = replace_once(
              game,
              '''        runOnUiThread(() -> {\n            if (!activityDestroyed && !isFinishing()) {\n                updatePipAutoEnter();\n            }\n        });\n''',
              '''        runOnUiThread(() -> {\n            if (!activityDestroyed && !isFinishing()) {\n                updatePipAutoEnter();\n                // Freeze-frame reconnect must not continue sending direct touch/mouse/keyboard\n                // input into a dead transport. connectionStarted() restores capture on success.\n                setInputGrabState(false);\n            }\n        });\n''',
              'suspend direct input during transport loss')

          game = replace_once(
              game,
              '''                            conn.start(new AndroidAudioRenderer(Game.this, prefConfig.playHostAudio),\n                                    decoderRenderer, Game.this);\n\n                            // A successful connectionStarted() atomically completes this reconnect\n                            // token. If the token remains current after the observation window, the\n                            // attempt did not establish a live transport and the worker may retry.\n                            Thread.sleep(2000);\n                            if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n                                return;\n                            }\n''',
              '''                            Thread reconnectStartThread = conn.restart(\n                                    new AndroidAudioRenderer(Game.this, prefConfig.playHostAudio),\n                                    decoderRenderer, Game.this);\n\n                            // NvConnection.start() is asynchronous. Wait for this exact replacement\n                            // start worker to finish rather than guessing with a fixed delay; this\n                            // prevents overlapping HTTP/native starts on slow failure paths.\n                            try {\n                                reconnectStartThread.join();\n                            } catch (InterruptedException e) {\n                                Thread.currentThread().interrupt();\n                                return;\n                            }\n                            if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n                                return;\n                            }\n''',
              'sequential restart worker ownership')

          helper_anchor = '''    @Override\n    public void connectionStatusUpdate(final int connectionStatus) {\n'''
          helper_text = '''    private boolean isTransportCallbackAllowed() {\n        synchronized (smartReconnectFence) {\n            return !activityDestroyed && !isFinishing() && (connecting || connected);\n        }\n    }\n\n'''
          if game.count(helper_anchor) != 1:
              raise SystemExit('transport callback helper anchor mismatch')
          game = game.replace(helper_anchor, helper_text + helper_anchor, 1)

          game = replace_once(
              game,
              '                if (activityDestroyed || isFinishing() || !connected) {\n                    return;\n                }\n                if (prefConfig.disableWarnings) {\n',
              '                if (!isTransportCallbackAllowed()) {\n                    return;\n                }\n                if (prefConfig.disableWarnings) {\n',
              'connection status startup callback allowance')

          for signature in [
              '    public void rumble(short controllerNumber, short lowFreqMotor, short highFreqMotor) {\n',
              '    public void rumbleTriggers(short controllerNumber, short leftTrigger, short rightTrigger) {\n',
              '    public void setHdrMode(boolean enabled, byte[] hdrMetadata) {\n',
              '    public void setMotionEventState(short controllerNumber, byte motionType, short reportRateHz) {\n',
              '    public void setControllerLED(short controllerNumber, byte r, byte g, byte b) {\n',
          ]:
              old = signature + '        if (activityDestroyed || isFinishing() || !connected) {\n            return;\n        }\n'
              new = signature + '        if (!isTransportCallbackAllowed()) {\n            return;\n        }\n'
              game = replace_once(game, old, new, signature.strip())

          game = replace_once(
              game,
              '''    public void displayMessage(final String message) {\n        runOnUiThread(new Runnable() {\n            @Override\n            public void run() {\n                if (activityDestroyed || isFinishing()) {\n                    return;\n                }\n''',
              '''    public void displayMessage(final String message) {\n        runOnUiThread(new Runnable() {\n            @Override\n            public void run() {\n                if (activityDestroyed || isFinishing() || smartReconnectFence.hasActiveAttempt()) {\n                    return;\n                }\n''',
              'suppress reconnect intermediate display message')
          game = replace_once(
              game,
              '''    public void displayTransientMessage(final String message) {\n        if (!prefConfig.disableWarnings) {\n            runOnUiThread(new Runnable() {\n                @Override\n                public void run() {\n                    if (activityDestroyed || isFinishing()) {\n                        return;\n                    }\n''',
              '''    public void displayTransientMessage(final String message) {\n        if (!prefConfig.disableWarnings) {\n            runOnUiThread(new Runnable() {\n                @Override\n                public void run() {\n                    if (activityDestroyed || isFinishing() || smartReconnectFence.hasActiveAttempt()) {\n                        return;\n                    }\n''',
              'suppress reconnect intermediate transient message')

          game_path.write_text(game, encoding='utf-8')

      - name: Enforce narrow repair scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected=$'app/src/main/java/com/limelight/Game.java\napp/src/main/java/com/limelight/nvstream/NvConnection.java'
          test "$(git diff --name-only)" = "$expected"
          grep -F 'public Thread restart(' app/src/main/java/com/limelight/nvstream/NvConnection.java >/dev/null
          grep -F 'connectionPermitGate.canReuse(NvConnection.this)' app/src/main/java/com/limelight/nvstream/NvConnection.java >/dev/null
          grep -F 'Thread reconnectStartThread = conn.restart(' app/src/main/java/com/limelight/Game.java >/dev/null
          grep -F 'smartReconnectStageFailure' app/src/main/java/com/limelight/Game.java >/dev/null
          ! grep -F 'connectionAllowed' app/src/main/java/com/limelight/nvstream/NvConnection.java

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"
      - name: Compile and run reconnect regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac \
            :app:testNonRoot_gameDebugUnitTest \
            --tests com.limelight.SmartReconnectFenceTest \
            --tests com.limelight.nvstream.ConnectionPermitGateTest \
            --tests com.limelight.GameActivityManifestTest \
            --tests com.limelight.SidewaysStreamModeTest \
            --stacktrace
      - name: Commit verified repair and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-lifecycle-connection-permit.yml
          git config user.name 'Artemis Plus Audit Bot'
          git config user.email 'artemis-plus-audit@users.noreply.github.com'
          git add app/src/main/java/com/limelight/Game.java \
                  app/src/main/java/com/limelight/nvstream/NvConnection.java \
                  .github/workflows/patch-lifecycle-connection-permit.yml
          git diff --cached --check
          git commit -m 'Repair reconnect permit ownership and callback gating'
          git push origin HEAD:fix/lifecycle-reconnect-input-teardown-v2
