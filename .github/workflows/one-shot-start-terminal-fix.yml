name: One-shot Start terminal fix

on:
  push:
    branches:
      - feature/phase2-5-audit-next
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase2-5-audit-next
          fetch-depth: 0
          submodules: recursive

      - name: Apply terminal-consumption audit fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              data = p.read_bytes()
              nl = '\r\n' if b'\r\n' in data else '\n'
              text = data.decode('utf-8').replace('\r\n', '\n')
              if new in text:
                  return
              if old not in text or text.count(old) != 1:
                  raise SystemExit(f'anchor problem in {path}')
              p.write_bytes(text.replace(old, new, 1).replace('\n', nl).encode('utf-8'))

          detector = 'app/src/main/java/com/limelight/BottomEdgeStartGestureDetector.java'
          edit(detector,
              '    private final long decisionTimeoutMs;\n\n    public BottomEdgeStartGestureDetector(float density) {',
              '    private final long decisionTimeoutMs;\n    private boolean consumeUntilTerminal;\n\n    public BottomEdgeStartGestureDetector(float density) {')
          edit(detector,
              '    public long getDecisionTimeoutMs() {\n        return decisionTimeoutMs;\n    }\n\n    public Decision decide(',
              '    public long getDecisionTimeoutMs() {\n        return decisionTimeoutMs;\n    }\n\n    public void consumeRecognizedGestureUntilTerminal() {\n        consumeUntilTerminal = true;\n    }\n\n    public boolean shouldConsumeRecognizedGestureEvent(boolean terminalEvent) {\n        if (!consumeUntilTerminal) {\n            return false;\n        }\n        if (terminalEvent) {\n            consumeUntilTerminal = false;\n        }\n        return true;\n    }\n\n    public void resetRecognizedGestureConsumption() {\n        consumeUntilTerminal = false;\n    }\n\n    public Decision decide(')

          game = 'app/src/main/java/com/limelight/Game.java'
          edit(game,
              '        int action = event.getActionMasked();\n        if (!bottomEdgeGesturePending) {',
              '        int action = event.getActionMasked();\n        boolean terminalEvent = action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL;\n        if (bottomEdgeStartGestureDetector.shouldConsumeRecognizedGestureEvent(terminalEvent)) {\n            return true;\n        }\n        if (!bottomEdgeGesturePending) {')
          edit(game,
              '        if (decision == BottomEdgeStartGestureDetector.Decision.TRIGGER) {\n            discardBottomEdgeGesture();\n            if (BottomEdgeStartGestureDetector.MODE_WINDOWS_KEY.equals(prefConfig.bottomEdgeStartGestureMode)) {',
              '        if (decision == BottomEdgeStartGestureDetector.Decision.TRIGGER) {\n            discardBottomEdgeGesture();\n            // The trigger normally happens on ACTION_MOVE. Consume every remaining event through\n            // ACTION_UP/CANCEL so Windows never receives an orphaned terminal event without DOWN.\n            bottomEdgeStartGestureDetector.consumeRecognizedGestureUntilTerminal();\n            if (BottomEdgeStartGestureDetector.MODE_WINDOWS_KEY.equals(prefConfig.bottomEdgeStartGestureMode)) {')
          edit(game,
              '        bottomEdgeGesturePending = false;\n        bottomEdgeGestureView = null;\n    }\n',
              '        bottomEdgeGesturePending = false;\n        bottomEdgeGestureView = null;\n    }\n')
          edit(game,
              '        discardBottomEdgeGesture();\n        timerHandler.removeCallbacksAndMessages(null);',
              '        discardBottomEdgeGesture();\n        if (bottomEdgeStartGestureDetector != null) {\n            bottomEdgeStartGestureDetector.resetRecognizedGestureConsumption();\n        }\n        timerHandler.removeCallbacksAndMessages(null);')

          test = 'app/src/test/java/com/limelight/BottomEdgeStartGestureDetectorTest.java'
          edit(test,
              '    @Test\n    public void ordinaryTapFallsBackAndAndroidCancelIsDiscarded() {',
              '    @Test\n    public void recognizedGestureConsumesEventsThroughTerminalOnly() {\n        detector.consumeRecognizedGestureUntilTerminal();\n        assertTrue(detector.shouldConsumeRecognizedGestureEvent(false));\n        assertTrue(detector.shouldConsumeRecognizedGestureEvent(true));\n        assertFalse(detector.shouldConsumeRecognizedGestureEvent(false));\n    }\n\n    @Test\n    public void ordinaryTapFallsBackAndAndroidCancelIsDiscarded() {')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"
      - run: chmod +x gradlew
      - name: Compile
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace
      - name: Regression tests
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LongPressMoveGestureGuardTest"
          --stacktrace
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet && exit 0
          git commit -m "fix: consume complete bottom-edge Start gesture"
          git push origin HEAD:feature/phase2-5-audit-next
