name: One-shot malformed preference source patch

on:
  push:
    branches:
      - fix/preference-malformed-string-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'juliekeygen-netizen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: fix/preference-malformed-string-recovery

      - name: Apply exact source patch
        run: python3 .github/patch-malformed-preferences.py

      - name: Commit source-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java
          git commit -m 'fix: recover malformed string-backed preferences'
          git push origin HEAD:fix/preference-malformed-string-recovery
