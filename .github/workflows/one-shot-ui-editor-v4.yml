name: One-shot UI Editor V4

on:
  push:
    branches:
      - feature/ui-editor-system-v4
    paths:
      - .github/workflows/one-shot-ui-editor-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ui-editor-system-v4
          fetch-depth: 0

      - name: Apply UI/editor phase patch
        run: python3 tools/one_shot_ui_editor_v4.py

      - name: Commit cleaned feature tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: unify editor UI and floating control behavior"
          git push origin HEAD:feature/ui-editor-system-v4
