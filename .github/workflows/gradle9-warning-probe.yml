name: Gradle 9 warning probe

on:
  push:
    branches:
      - audit/gradle9-warning-probe

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[gradle-probe-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"
      - name: Capture all Gradle deprecations
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --warning-mode all --stacktrace 2>&1 | tee /tmp/gradle-warning-probe.log
          echo '===== DEPRECATION / GRADLE 9 LINES ====='
          grep -n -E -i 'deprecated|deprecation|Gradle 9|will be removed|will become an error' /tmp/gradle-warning-probe.log || true
      - name: Remove temporary probe from branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gradle9-warning-probe.yml
          git config user.name 'Artemis Plus Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gradle9-warning-probe.yml
          git commit -m 'Remove temporary Gradle warning probe [gradle-probe-bot]'
          git push origin HEAD:audit/gradle9-warning-probe
