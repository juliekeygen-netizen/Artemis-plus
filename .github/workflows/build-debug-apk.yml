name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Public certificate identity metadata, shared by all release-verification steps so copies cannot
# drift independently. The private keystore/passwords remain encrypted GitHub secrets.
env:
  ARTEMIS_PLUS_EXPECTED_SIGNER_SHA256: 88c430db21b298bab7b654ce3b9300e33bf1917df4bf1a73047c9590f0080083

# Building/signing only needs repository reads. The separate publish job receives the
# write-scoped token after the APKs and signer have already been validated.
permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never expose the persistent release-signing path to a manually dispatched branch run.
    # Audit/feature branches use Android CI; rolling signed APKs are a main-only artifact.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.signing.outputs.version_name }}
      version_code: ${{ steps.signing.outputs.version_code }}
      signer_sha256: ${{ steps.signing.outputs.signer_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Configure and verify Artemis Plus signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ARTEMIS_PLUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARTEMIS_PLUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARTEMIS_PLUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARTEMIS_PLUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          EXPECTED_SIGNER_SHA256="$ARTEMIS_PLUS_EXPECTED_SIGNER_SHA256"
          KEYSTORE_PATH="$RUNNER_TEMP/artemis-plus.jks"

          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "Persistent Artemis Plus signing secrets are not fully configured." >&2
            echo "Refusing to create a rolling main build with an ephemeral or partial signer." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          VERSION_CODE="$(( $(date +%s) / 60 ))"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_NAME="20.2.6-plus.${VERSION_CODE}.${SHORT_SHA}"
          SIGNER_SHA256="$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print tolower($1)}')"

          if [[ "$SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "Artemis Plus signing identity mismatch." >&2
            echo "Expected: $EXPECTED_SIGNER_SHA256" >&2
            echo "Actual:   $SIGNER_SHA256" >&2
            echo "Refusing to build/publish an APK that would break update compatibility." >&2
            exit 1
          fi

          echo "ARTEMIS_PLUS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_SIGNER_SHA256=$SIGNER_SHA256" >> "$GITHUB_ENV"
          echo "ARTEMIS_PLUS_PERSISTENT_SIGNER=true" >> "$GITHUB_ENV"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$SIGNER_SHA256" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Verified signer SHA-256: $SIGNER_SHA256"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build installable debug APKs
        run: ./gradlew :app:assembleNonRoot_gameDebug --stacktrace

      - name: Prepare and verify download package
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SIGNER_SHA256="$ARTEMIS_PLUS_EXPECTED_SIGNER_SHA256"
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -path '*nonRoot_game*debug*' -print -exec cp '{}' dist/ \;

          if ! compgen -G 'dist/*.apk' > /dev/null; then
            echo 'No debug APKs were produced.' >&2
            exit 1
          fi

          # The non-root debug build is intentionally ABI-split. Fail if a configured architecture
          # silently disappears or if a new unexpected artifact begins riding the rolling release.
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mapfile -t matches < <(find dist -maxdepth 1 -type f -name "*-${abi}-debug.apk" -print)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one ${abi} debug APK, found ${#matches[@]}." >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
          done
          if [[ $(find dist -maxdepth 1 -type f -name '*.apk' | wc -l) -ne 4 ]]; then
            echo 'Unexpected APK count in rolling release package.' >&2
            find dist -maxdepth 1 -type f -name '*.apk' -print >&2
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo 'Android SDK build-tools directory is unavailable.' >&2
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo 'apksigner was not found after the Android build.' >&2
            exit 1
          fi

          for apk in dist/*.apk; do
            cert_sha256="$($APKSIGNER verify --print-certs "$apk" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
            if [[ -z "$cert_sha256" ]]; then
              echo "Unable to read signer fingerprint from $apk" >&2
              exit 1
            fi
            if [[ "$cert_sha256" != "$EXPECTED_SIGNER_SHA256" ]]; then
              echo "APK signer mismatch for $apk" >&2
              echo "Expected: $EXPECTED_SIGNER_SHA256" >&2
              echo "Actual:   $cert_sha256" >&2
              exit 1
            fi
          done

          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS.txt
          )

          cat > dist/INSTALL.txt <<EOF
          Artemis Plus debug APKs
          =======================

          These APKs are debug test builds of Artemis Plus.

          Choose the APK matching your Android device CPU:
          - arm64-v8a: almost all modern Android phones/tablets
          - armeabi-v7a: older 32-bit ARM devices
          - x86_64 / x86: mainly emulators or uncommon Intel Android devices

          Version: ${ARTEMIS_PLUS_VERSION_NAME}
          Version code: ${ARTEMIS_PLUS_VERSION_CODE}
          Signer SHA-256: ${ARTEMIS_PLUS_SIGNER_SHA256}
          Persistent project signer: true

          Later APKs signed by this same Artemis Plus key can be installed directly as updates
          without uninstalling the app first.
          EOF

          cat > dist/SIGNING.txt <<EOF
          Artemis Plus signing identity
          =============================

          Commit: ${GITHUB_SHA}
          Version: ${ARTEMIS_PLUS_VERSION_NAME}
          Version code: ${ARTEMIS_PLUS_VERSION_CODE}
          Certificate SHA-256: ${ARTEMIS_PLUS_SIGNER_SHA256}
          Expected certificate SHA-256: ${EXPECTED_SIGNER_SHA256}
          Persistent project signer: true
          APK signer verification: passed for all release APKs
          EOF

          echo 'Verified APKs:'
          ls -lh dist/*.apk

      - name: Upload verified Artemis Plus release package
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Plus-debug-APKs
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified release package
        uses: actions/download-artifact@v4
        with:
          name: Artemis-Plus-debug-APKs
          path: dist

      - name: Publish rolling debug release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEMIS_PLUS_VERSION_NAME: ${{ needs.build.outputs.version_name }}
          ARTEMIS_PLUS_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          ARTEMIS_PLUS_SIGNER_SHA256: ${{ needs.build.outputs.signer_sha256 }}
        run: |
          set -euo pipefail

          EXPECTED_SIGNER_SHA256="$ARTEMIS_PLUS_EXPECTED_SIGNER_SHA256"
          if [[ "$ARTEMIS_PLUS_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo 'Refusing to publish because the verified build signer changed between jobs.' >&2
            exit 1
          fi

          TAG='debug-latest'
          TITLE='Artemis Plus Debug (Latest)'
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"

          cat > release-notes.md <<EOF
          ## Artemis Plus latest debug build

          Automatically built from the current \`main\` branch.

          - Commit: \`${GITHUB_SHA}\`
          - Short commit: \`${SHORT_SHA}\`
          - Built: ${BUILT_AT}
          - Version: \`${ARTEMIS_PLUS_VERSION_NAME}\`
          - Version code: \`${ARTEMIS_PLUS_VERSION_CODE}\`
          - Signer SHA-256: \`${ARTEMIS_PLUS_SIGNER_SHA256}\`
          - Build type: non-root debug
          - Release APK signer verification: passed

          **Most modern Android phones/tablets should use the \`arm64-v8a\` APK.**

          Later builds can be installed directly over earlier Artemis Plus builds only when the
          certificate SHA-256 above remains the established Artemis Plus fingerprint. See
          \`INSTALL.txt\`, \`SIGNING.txt\`, and \`SHA256SUMS.txt\` for details.
          EOF

          # Move the rolling tag only after the package has been fully verified. Preserve the
          # existing release object so a transient API failure does not erase the download page.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              dist/INSTALL.txt \
              dist/SIGNING.txt \
              --clobber
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              --verify-tag
          else
            gh release create "$TAG" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              dist/INSTALL.txt \
              dist/SIGNING.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              --verify-tag
          fi
