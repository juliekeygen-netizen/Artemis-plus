name: One-shot profile state hardening

on:
  push:
    branches:
      - audit/lifecycle-hardening-3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/lifecycle-hardening-3
          fetch-depth: 0
          submodules: recursive

      - name: Apply profile-state audit fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              p = Path(path)
              data = p.read_bytes()
              nl = '\r\n' if b'\r\n' in data else '\n'
              return data.decode('utf-8').replace('\r\n', '\n'), nl

          def write(path, text, nl='\n'):
              Path(path).write_bytes(text.replace('\n', nl).encode('utf-8'))

          def replace_once(path, old, new):
              text, nl = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor missing: {path}: {old[:180]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique: {path}: {text.count(old)}')
              write(path, text.replace(old, new, 1), nl)

          settings = 'app/src/main/java/com/limelight/preferences/StreamSettings.java'
          replace_once(settings,
              '''            ListPreference outsideOrientation = findPreference(OutsideStreamOrientationPolicy.PREF_KEY);\n            if (outsideOrientation != null) {\n                outsideOrientation.setOnPreferenceChangeListener((preference, newValue) -> {\n                    String requestedMode = String.valueOf(newValue);\n                    requireActivity().getWindow().getDecorView().post(() ->\n                            OutsideStreamOrientationPolicy.apply(requireActivity(), requestedMode));\n                    return true;\n                });\n            }''',
              '''            ListPreference outsideOrientation = findPreference(OutsideStreamOrientationPolicy.PREF_KEY);\n            // Only the real global Settings screen should immediately apply this app-level policy.\n            // ProfilePreferenceFragment inherits this class but edits a future profile in isolation.\n            if (outsideOrientation != null && requireActivity() instanceof StreamSettings) {\n                outsideOrientation.setOnPreferenceChangeListener((preference, newValue) -> {\n                    String requestedMode = String.valueOf(newValue);\n                    requireActivity().getWindow().getDecorView().post(() ->\n                            OutsideStreamOrientationPolicy.apply(requireActivity(), requestedMode));\n                    return true;\n                });\n            }''')

          profile = 'app/src/main/java/com/limelight/EditProfileActivity.java'
          replace_once(profile,
              '''    private ProfilePreferenceFragment prefsFragment;\n    private String pendingProfileName; // Holds new name for unsaved profiles\n''',
              '''    private ProfilePreferenceFragment prefsFragment;\n    private String pendingProfileName; // Holds new name for unsaved profiles\n\n    private static final String STATE_PENDING_PROFILE_NAME = "profile.pendingName";\n    private static final String STATE_PROFILE_PREFS = "profile.unsavedPrefs";\n''')

          replace_once(profile,
              '''        } else {\n            // Creating new profile\n            setTitle(getString(R.string.profile_manager_new_profile));\n            inMemoryPrefs = new InMemorySharedPreferences(PreferenceManager.getDefaultSharedPreferences(this).getAll());\n        }\n\n        androidx.fragment.app.Fragment restoredFragment =''',
              '''        } else {\n            // Creating new profile\n            setTitle(getString(R.string.profile_manager_new_profile));\n            inMemoryPrefs = new InMemorySharedPreferences(PreferenceManager.getDefaultSharedPreferences(this).getAll());\n        }\n\n        if (savedInstanceState != null) {\n            Map<String, Object> restoredPrefs = decodePreferenceState(\n                    savedInstanceState.getBundle(STATE_PROFILE_PREFS));\n            if (restoredPrefs != null) {\n                inMemoryPrefs = new InMemorySharedPreferences(restoredPrefs);\n            }\n            pendingProfileName = savedInstanceState.getString(STATE_PENDING_PROFILE_NAME);\n            if (currentProfile == null && pendingProfileName != null && !pendingProfileName.trim().isEmpty()) {\n                setTitle(getString(R.string.profile_manager_new_profile_with, pendingProfileName));\n            }\n        }\n\n        androidx.fragment.app.Fragment restoredFragment =''')

          replace_once(profile,
              '''    @Override\n    public boolean onCreateOptionsMenu(Menu menu) {''',
              '''    @Override\n    protected void onSaveInstanceState(@NonNull Bundle outState) {\n        super.onSaveInstanceState(outState);\n        outState.putString(STATE_PENDING_PROFILE_NAME, pendingProfileName);\n        if (inMemoryPrefs != null) {\n            outState.putBundle(STATE_PROFILE_PREFS, encodePreferenceState(inMemoryPrefs.getAll()));\n        }\n    }\n\n    private static Bundle encodePreferenceState(Map<String, ?> values) {\n        Bundle state = new Bundle();\n        if (values == null) {\n            return state;\n        }\n        for (Map.Entry<String, ?> entry : values.entrySet()) {\n            String key = entry.getKey();\n            Object value = entry.getValue();\n            if (value instanceof String) {\n                state.putString(key, (String) value);\n            } else if (value instanceof Integer) {\n                state.putInt(key, (Integer) value);\n            } else if (value instanceof Long) {\n                state.putLong(key, (Long) value);\n            } else if (value instanceof Float) {\n                state.putFloat(key, (Float) value);\n            } else if (value instanceof Boolean) {\n                state.putBoolean(key, (Boolean) value);\n            } else if (value instanceof java.util.Set) {\n                java.util.ArrayList<String> copy = new java.util.ArrayList<>();\n                for (Object item : (java.util.Set<?>) value) {\n                    if (item instanceof String) {\n                        copy.add((String) item);\n                    }\n                }\n                state.putStringArrayList(key, copy);\n            }\n        }\n        return state;\n    }\n\n    private static Map<String, Object> decodePreferenceState(Bundle state) {\n        if (state == null) {\n            return null;\n        }\n        Map<String, Object> values = new HashMap<>();\n        for (String key : state.keySet()) {\n            Object value = state.get(key);\n            if (value instanceof java.util.ArrayList) {\n                java.util.HashSet<String> set = new java.util.HashSet<>();\n                for (Object item : (java.util.ArrayList<?>) value) {\n                    if (item instanceof String) {\n                        set.add((String) item);\n                    }\n                }\n                values.put(key, set);\n            } else if (value instanceof String || value instanceof Integer || value instanceof Long ||\n                    value instanceof Float || value instanceof Boolean) {\n                values.put(key, value);\n            }\n        }\n        return values;\n    }\n\n    @Override\n    public boolean onCreateOptionsMenu(Menu menu) {''')

          replace_once(profile,
              '''        @Override\n        public Map<String, ?> getAll() {\n            return new HashMap<>(values);\n        }''',
              '''        @Override\n        public Map<String, ?> getAll() {\n            Map<String, Object> copy = new HashMap<>();\n            for (Map.Entry<String, Object> entry : values.entrySet()) {\n                Object value = entry.getValue();\n                if (value instanceof java.util.Set) {\n                    copy.put(entry.getKey(), new java.util.HashSet<>((java.util.Set<String>) value));\n                } else {\n                    copy.put(entry.getKey(), value);\n                }\n            }\n            return copy;\n        }''')
          replace_once(profile,
              '''        public java.util.Set<String> getStringSet(String key, java.util.Set<String> defValues) {\n            Object value = values.get(key);\n            return value instanceof java.util.Set ? (java.util.Set<String>) value : defValues;\n        }''',
              '''        public java.util.Set<String> getStringSet(String key, java.util.Set<String> defValues) {\n            Object value = values.get(key);\n            return value instanceof java.util.Set\n                    ? new java.util.HashSet<>((java.util.Set<String>) value)\n                    : defValues;\n        }''')
          replace_once(profile,
              '''        private class InMemoryEditor implements Editor {\n            private final Map<String, Object> changes = new HashMap<>();''',
              '''        private class InMemoryEditor implements Editor {\n            private final Map<String, Object> changes = new HashMap<>();\n            private boolean clearRequested;''')
          replace_once(profile,
              '''            public Editor putStringSet(String key, java.util.Set<String> values) {\n                changes.put(key, values);\n                return this;\n            }''',
              '''            public Editor putStringSet(String key, java.util.Set<String> values) {\n                changes.put(key, values == null ? null : new java.util.HashSet<>(values));\n                return this;\n            }''')
          replace_once(profile,
              '''            public Editor clear() {\n                values.clear();\n                return this;\n            }''',
              '''            public Editor clear() {\n                clearRequested = true;\n                return this;\n            }''')
          replace_once(profile,
              '''            public void apply() {\n                for (Map.Entry<String, Object> entry : changes.entrySet()) {''',
              '''            public void apply() {\n                if (clearRequested) {\n                    values.clear();\n                    clearRequested = false;\n                }\n                for (Map.Entry<String, Object> entry : changes.entrySet()) {''')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run relevant regressions
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.preferences.StreamSettingsFragmentLifecycleTest"
          --tests "com.limelight.OutsideStreamOrientationPolicyTest"
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --stacktrace

      - name: Commit verified product fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve profile editor transient state"
          git push origin audit/lifecycle-hardening-3
