name: Normalize first patch diff

on:
  push:
    branches:
      - feature/first-patch-v4-orientation-settings-search
    paths:
      - '.github/workflows/one-shot-first-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-patch-v4-orientation-settings-search
          fetch-depth: 0

      - name: Restore original CRLF convention on touched legacy files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'app/src/main/java/com/limelight/preferences/StreamSettings.java',
              'app/src/main/res/values/arrays.xml',
          ]:
              p = Path(name)
              data = p.read_bytes().replace(b'\r\n', b'\n')
              p.write_bytes(data.replace(b'\n', b'\r\n'))
          PY

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/preferences/StreamSettings.java app/src/main/res/values/arrays.xml
          if git diff --cached --quiet; then
            echo "No normalization changes needed"
            exit 0
          fi
          git commit -m "chore: preserve legacy line endings in first patch"
          git push origin HEAD:feature/first-patch-v4-orientation-settings-search
