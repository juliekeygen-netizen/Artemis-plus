name: Editor Profiles V3 One Shot

on:
  push:
    branches:
      - feature/editor-profiles-v3
    paths:
      - .github/workflows/editor-profiles-v3-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editor-profiles-v3
      - name: Apply settings/profile patch
        run: python3 scripts/apply_editor_profiles_v3_settings.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/xml/preferences.xml app/src/main/java/com/limelight/preferences/StreamSettings.java app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesDialog.java
          git diff --cached --quiet && exit 0
          git commit -m "feat: make keyboard settings profile-aware"
          git push origin HEAD:feature/editor-profiles-v3
