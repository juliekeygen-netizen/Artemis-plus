name: Android CI

on:
  push:
    branches:
      - main
      - feature/diana-osc-port
      - 'audit/**'
      - 'fix/**'
      - 'maintenance/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate release signer parser fixtures
        shell: bash
        run: bash .github/scripts/test-extract-apksigner-sha256.sh

      - name: Validate Artemis Plus PowerShell helper syntax
        shell: pwsh
        run: |
          $files = @(
            'signing-common.ps1',
            'setup-signing.ps1',
            'build-apk.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in ${file}:"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Keep the command-line-tools version proven by the existing pipeline. This update is
          # about the Node 24 action runtime, not silently changing the Android toolchain too.
          cmdline-tools-version: 12266719

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run Artemis Plus regression tests
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.ArtemisOrientationHelperTest"
          --tests "com.limelight.SidewaysStreamModeTest"
          --tests "com.limelight.StreamContainerSurfaceLifecycleTest"
          --tests "com.limelight.OutsideStreamOrientationPolicyTest"
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.PipAspectRatioHelperTest"
          --tests "com.limelight.PipManualEntryGuardTest"
          --tests "com.limelight.SmartReconnectLifecycleTest"
          --tests "com.limelight.ClipboardSyncLifecycleTest"
          --tests "com.limelight.nvstream.NvConnectionStartGateTest"
          --tests "com.limelight.nvstream.GenerationBoundNvConnectionListenerTest"
          --tests "com.limelight.nvstream.NvConnectionLifecycleIntegrationTest"
          --tests "com.limelight.GameClipboardLifecycleTest"
          --tests "com.limelight.GameCommitTextLifecycleTest"
          --tests "com.limelight.GameConnectionCallbackLifecycleTest"
          --tests "com.limelight.GameDelayedCallbackLifecycleTest"
          --tests "com.limelight.GameInputGrabRestoreLifecycleTest"
          --tests "com.limelight.GameStopWorkerLifecycleTest"
          --tests "com.limelight.GameSendKeysLifecycleTest"
          --tests "com.limelight.ProfileEditorPreferenceValuesTest"
          --tests "com.limelight.binding.input.ControllerHandlerBatteryLifecycleTest"
          --tests "com.limelight.binding.input.ControllerHandlerBatterySuspensionLifecycleTest"
          --tests "com.limelight.binding.input.ControllerHandlerSensorSuspensionLifecycleTest"
          --tests "com.limelight.binding.input.ControllerHandlerMouseEmulationSuspensionLifecycleTest"
          --tests "com.limelight.binding.input.ControllerHandlerRumbleSuspensionLifecycleTest"
          --tests "com.limelight.binding.input.capture.AndroidNativePointerCaptureProviderLifecycleTest"
          --tests "com.limelight.binding.input.driver.UsbDriverServiceLifecycleTest"
          --tests "com.limelight.binding.input.virtual_controller.OscProfilesManagerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.ArtemisActionButtonFactoryTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.KeyComboManagerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.KeyboardInputReleaseTrackerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.KeyboardProfileStorageAliasRecoveryTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.KeyboardProfilesManagerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LayoutSnappingHelperTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LongPressMoveGestureGuardTest"
          --tests "com.limelight.nvstream.http.PairingManagerRetryTest"
          --tests "com.limelight.ui.FloatingControlPositionStoreTest"
          --tests "com.limelight.wifi.WifiMonitorLifecycleTest"
          --tests "com.limelight.preferences.BackgroundStreamingPolicyTest"
          --tests "com.limelight.preferences.GlPreferencesTest"
          --tests "com.limelight.preferences.PreferenceStringValuesTest"
          --tests "com.limelight.GameActivityManifestTest"
          --tests "com.limelight.preferences.StreamSettingsFragmentLifecycleTest"
          --tests "com.limelight.preferences.StreamSettingsPreferenceRecoveryTest"
          --tests "com.limelight.profiles.OverlayPreferencesTest"
          --tests "com.limelight.profiles.ProfilesManagerTest"
          --tests "com.limelight.quickmenu.QuickMenuConfigTest"
          --stacktrace

      - name: Run full inherited unit suite (diagnostic)
        id: inherited_tests
        continue-on-error: true
        run: ./gradlew :app:testNonRoot_gameDebugUnitTest --stacktrace

      - name: Note inherited baseline failures
        if: steps.inherited_tests.outcome == 'failure'
        run: |
          echo "The inherited Artemis/Marssvoodoo test baseline currently contains known Robolectric failures."
          echo "These same failures were reproduced from the pre-OSC base commit f5587a81d73bf2501b68f1e5a48ca736aa5520a2."
          echo "See the uploaded full test report for details."

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
