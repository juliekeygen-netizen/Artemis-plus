name: Resource warning cleanup v2

on:
  push:
    branches:
      - audit/resource-warning-cleanup-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[bot-patch-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply byte-preserving guarded cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          orphan_names = [
              'category_perf_charts',
              'desc_chart_decode',
              'desc_chart_fps',
              'desc_chart_latency',
              'summary_enable_perf_charts',
              'summary_perf_chart_decode',
              'summary_perf_chart_fps',
              'summary_perf_chart_latency',
              'title_enable_perf_charts',
              'title_perf_chart_decode',
              'title_perf_chart_fps',
              'title_perf_chart_latency',
          ]

          for name in orphan_names:
              unexpected = []
              token = name.encode('utf-8')
              for path in (root / 'app/src/main').rglob('*'):
                  if not path.is_file() or path.suffix not in {'.java', '.kt', '.xml'}:
                      continue
                  data = path.read_bytes()
                  if token not in data:
                      continue
                  normalized = path.as_posix()
                  declaration = re.search(
                      rb'<string\s+name="' + re.escape(token) + rb'"(?:\s|>)', data)
                  declaration_only = '/res/values-' in ('/' + normalized) and declaration
                  if not declaration_only:
                      unexpected.append(normalized)
              if unexpected:
                  raise SystemExit(f'{name} still has live/non-locale references: {unexpected}')

          removed = {name: [] for name in orphan_names}
          for path in (root / 'app/src/main/res').glob('values-*/*.xml'):
              data = path.read_bytes()
              original = data
              for name in orphan_names:
                  token = re.escape(name.encode('utf-8'))
                  pattern = re.compile(
                      rb'^[ \t]*<string\s+name="' + token +
                      rb'"(?:\s+[^>]*)?>[^\r\n]*?</string>[ \t]*(?:\r\n|\n|\r)?',
                      re.MULTILINE)
                  data, count = pattern.subn(b'', data)
                  if count:
                      removed[name].extend([path.as_posix()] * count)
              if data != original:
                  path.write_bytes(data)

          missing = [name for name, paths in removed.items() if not paths]
          if missing:
              raise SystemExit(f'Expected orphan resource declarations were not found: {missing}')
          for name, paths in removed.items():
              print(f'Removed {name}: {paths}')

          static_summary = b'title_render_mode_balance_shift_description'
          for relative in [
              'app/src/main/res/values-ru/strings.xml',
              'app/src/main/res/values-zh-rCN/strings.xml',
              'app/src/main/res/values-zh-rTW/strings.xml',
          ]:
              path = root / relative
              data = path.read_bytes()
              old = b'<string name="' + static_summary + b'">'
              new = b'<string name="' + static_summary + b'" formatted="false">'
              if data.count(old) != 1:
                  raise SystemExit(f'Expected exactly one unformatted summary in {relative}')
              path.write_bytes(data.replace(old, new, 1))
              print('Marked static percent-bearing summary non-formatted:', relative)

      - name: Enforce minimal diff shape
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check
          git diff --numstat
          unexpected="$(git diff --name-only | grep -Ev '^app/src/main/res/values-[^/]+/[^/]+\.xml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected file changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          total_changes="$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')"
          if (( total_changes > 40 )); then
            echo "Resource cleanup diff is unexpectedly large (${total_changes} changed lines)." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Verify Android resources and compilation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:processNonRoot_gameDebugResources :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace 2>&1 | tee /tmp/resource-build.log
          for name in \
            category_perf_charts desc_chart_decode desc_chart_fps desc_chart_latency \
            summary_enable_perf_charts summary_perf_chart_decode summary_perf_chart_fps summary_perf_chart_latency \
            title_enable_perf_charts title_perf_chart_decode title_perf_chart_fps title_perf_chart_latency; do
            if grep -F "removing resource com.limelight.noirdebug:string/${name} without required default value" /tmp/resource-build.log; then
              echo "Stale missing-default warning remains for ${name}" >&2
              exit 1
            fi
          done
          if grep -F 'title_render_mode_balance_shift_description' /tmp/resource-build.log | grep -F 'multiple substitutions' >/dev/null; then
            echo 'Static percent summary formatting warning remains.' >&2
            exit 1
          fi

      - name: Commit verified minimal cleanup and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resource-warning-cleanup-v2.yml
          git config user.name 'Artemis Plus Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/res .github/workflows/resource-warning-cleanup-v2.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          total_changes="$(git diff --cached --numstat | awk '$3 !~ /^\.github\/workflows\// {a+=$1; d+=$2} END {print a+d+0}')"
          if (( total_changes > 40 )); then
            echo "Final resource diff unexpectedly large (${total_changes} changed lines)." >&2
            exit 1
          fi
          git commit -m 'Clean stale Android resource warnings [bot-patch-v2]'
          git push origin HEAD:audit/resource-warning-cleanup-v2
