name: One-shot Zoom Toast Cleanup

on:
  push:
    branches:
      - feature/editor-combos-pairing-resilience
    paths:
      - .github/workflows/one-shot-remove-zoom-toast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editor-combos-pairing-resilience
          fetch-depth: 0

      - name: Remove Zoom/Pan toggle toast only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/limelight/Game.java')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(    public void toggleZoomMode\(\) \{\n'
              r'        this\.isPanZoomMode = !this\.isPanZoomMode;\n)'
              r'        if \(this\.isPanZoomMode\) \{\n'
              r'            Toast\.makeText\(this, getString\(R\.string\.pan_zoom_mode_enabled\), Toast\.LENGTH_SHORT\)\.show\(\);\n'
              r'        \} else \{\n'
              r'            Toast\.makeText\(this, getString\(R\.string\.pan_zoom_mode_disabled\), Toast\.LENGTH_SHORT\)\.show\(\);\n'
              r'        \}\n'
              r'(        updateZoomButtonAppearance\(\);)'
          )
          updated, count = pattern.subn(r'\1\2', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one toggleZoomMode toast block; matched {count}')
          if 'R.string.pan_zoom_mode_enabled), Toast.LENGTH_SHORT).show()' in updated or 'R.string.pan_zoom_mode_disabled), Toast.LENGTH_SHORT).show()' in updated:
              raise SystemExit('Zoom toast calls still present')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit exact cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/Game.java
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove zoom pan toggle toast"
          git push origin HEAD:feature/editor-combos-pairing-resilience
