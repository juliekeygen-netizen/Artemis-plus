name: One-shot Fix Loader Brace

on:
  push:
    branches:
      - feature/ui-editor-system-v4
    paths:
      - .github/workflows/one-shot-fix-loader-brace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-editor-system-v4
      - run: python3 tools/one_shot_fix_loader_brace.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore keyboard profile loader structure"
          git push origin HEAD:feature/ui-editor-system-v4
