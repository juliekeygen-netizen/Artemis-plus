name: One-shot PiP bounds audit

on:
  push:
    branches:
      - feature/phase2-5-audit-next
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase2-5-audit-next
          fetch-depth: 0
          submodules: recursive
      - name: Apply PiP bounds fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/limelight/Game.java')
          data = p.read_bytes()
          nl = '\r\n' if b'\r\n' in data else '\n'
          text = data.decode('utf-8').replace('\r\n', '\n')
          old = '''        int[] viewLocation = new int[2];\n\n        view.getLocationOnScreen(viewLocation);\n\n        int left = viewLocation[0];\n        int top = viewLocation[1];\n        int width = Math.max(1, view.getWidth());\n        int height = Math.max(1, view.getHeight());\n        Rational aspectRatio = new Rational(width, height);\n        hint = new Rect(left, top, left + width, top + height);\n'''
          new = '''        // Android recommends using the actually visible video bounds as the PiP transition\n        // hint. This also avoids animating from content that is clipped by the current window.\n        hint = new Rect();\n        if (!view.getGlobalVisibleRect(hint) || hint.isEmpty()) {\n            int[] viewLocation = new int[2];\n            view.getLocationOnScreen(viewLocation);\n            int width = Math.max(1, view.getWidth());\n            int height = Math.max(1, view.getHeight());\n            hint.set(viewLocation[0], viewLocation[1],\n                    viewLocation[0] + width, viewLocation[1] + height);\n        }\n\n        int[] pipRatio = PipAspectRatioHelper.clamp(hint.width(), hint.height());\n        Rational aspectRatio = new Rational(pipRatio[0], pipRatio[1]);\n'''
          if new not in text:
              if old not in text or text.count(old) != 1:
                  raise SystemExit('PiP parameter anchor missing or non-unique')
              text = text.replace(old, new, 1)
              p.write_bytes(text.replace('\n', nl).encode('utf-8'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"
      - run: chmod +x gradlew
      - name: Compile
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace
      - name: PiP and Start regression tests
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.PipAspectRatioHelperTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --stacktrace
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/Game.java
          git diff --cached --quiet && exit 0
          git commit -m "fix: constrain PiP transition bounds"
          git push origin HEAD:feature/phase2-5-audit-next
