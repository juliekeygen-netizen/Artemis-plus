name: Lifecycle reconnect and input teardown patch

on:
  push:
    branches:
      - fix/lifecycle-reconnect-input-teardown

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[lifecycle-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply exact guarded Game lifecycle patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/limelight/Game.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private boolean connecting = false;\n',
              '    private volatile boolean connecting = false;\n',
              'connecting visibility')

          replace_once(
              '    private static final int SMART_RECONNECT_MAX_ATTEMPTS = 6;\n',
              '    private static final int SMART_RECONNECT_MAX_ATTEMPTS = 6;\n'
              '    private final SmartReconnectFence smartReconnectFence = new SmartReconnectFence();\n'
              '    private volatile boolean activityDestroyed = false;\n',
              'reconnect lifecycle fields')

          start_pattern = re.compile(r'(?m)^([ \t]*)conn\.start\(')
          starts = list(start_pattern.finditer(text))
          if len(starts) != 3:
              raise SystemExit(f'connection start sites: expected 3, found {len(starts)}')
          text = start_pattern.sub(lambda m: m.group(1) + 'connecting = true;\n' + m.group(1) + 'conn.start(', text)

          replace_once(
              '    private void stopConnection(boolean preserveControllerStateForReconnect, Runnable onStopped) {\n'
              '        if (connecting || connected) {\n',
              '    private void stopConnection(boolean preserveControllerStateForReconnect, Runnable onStopped) {\n'
              '        smartReconnectFence.cancel();\n'
              '        cancelPendingCommitText();\n'
              '        if (reconnectOverlay != null) {\n'
              '            reconnectOverlay.hide();\n'
              '        }\n'
              '        if (connecting || connected) {\n',
              'stopConnection cancellation')

          replace_once(
              '    private void enqueueCommitText(String text) {\n',
              '    private void cancelPendingCommitText() {\n'
              '        commitTextHandler.removeCallbacks(flushCommitTextQueue);\n'
              '        commitTextQueue.clear();\n'
              '    }\n\n'
              '    private void enqueueCommitText(String text) {\n',
              'commit text cancellation helper')

          replace_once(
              '        super.onPause();\n',
              '        cancelPendingCommitText();\n'
              '        super.onPause();\n',
              'pause input cancellation')

          replace_once(
              '    protected void onDestroy() {\n'
              '        super.onDestroy();\n',
              '    protected void onDestroy() {\n'
              '        activityDestroyed = true;\n'
              '        smartReconnectFence.cancel();\n'
              '        cancelPendingCommitText();\n'
              '        super.onDestroy();\n',
              'destroy lifecycle fence')

          replace_once(
              '    public void connectionStarted() {\n'
              '        runOnUiThread(new Runnable() {\n',
              '    public void connectionStarted() {\n'
              '        if (activityDestroyed || isFinishing()) {\n'
              '            LimeLog.info("Ignoring connectionStarted callback after Activity teardown");\n'
              '            return;\n'
              '        }\n'
              '        runOnUiThread(new Runnable() {\n',
              'connectionStarted teardown guard')

          replace_once(
              '    public void connectionTerminated(final int errorCode) {\n',
              '    public void connectionTerminated(final int errorCode) {\n'
              '        if (activityDestroyed || isFinishing()) {\n'
              '            LimeLog.info("Ignoring connectionTerminated callback after Activity teardown");\n'
              '            return;\n'
              '        }\n',
              'connectionTerminated teardown guard')

          replace_once(
              '        // Attempt smart reconnect: freeze frame is automatic (we don\'t clear the surface)\n',
              '        // Attempt smart reconnect: freeze frame is automatic (we don\'t clear the surface)\n'
              '        final int reconnectToken = smartReconnectFence.beginAttempt();\n',
              'smart reconnect token')

          replace_once(
              '                for (int attempt = 1; attempt <= SMART_RECONNECT_MAX_ATTEMPTS; attempt++) {\n'
              '                    final int currentAttempt = attempt;\n',
              '                for (int attempt = 1; attempt <= SMART_RECONNECT_MAX_ATTEMPTS; attempt++) {\n'
              '                    if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n'
              '                        return;\n'
              '                    }\n'
              '                    final int currentAttempt = attempt;\n',
              'reconnect loop fence')

          replace_once(
              '                    } catch (InterruptedException e) {\n'
              '                        break;\n'
              '                    }\n\n'
              '                    // Check if WiFi/network is available\n',
              '                    } catch (InterruptedException e) {\n'
              '                        Thread.currentThread().interrupt();\n'
              '                        return;\n'
              '                    }\n'
              '                    if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n'
              '                        return;\n'
              '                    }\n\n'
              '                    // Check if WiFi/network is available\n',
              'reconnect backoff fence')

          replace_once(
              '                    try {\n'
              '                        synchronized (MoonBridge.class) {\n',
              '                    try {\n'
              '                        if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n'
              '                            return;\n'
              '                        }\n'
              '                        synchronized (MoonBridge.class) {\n',
              'reconnect bridge fence')

          replace_once(
              '                        if (conn != null && reconnectSurface != null) {\n'
              '                            decoderRenderer.setRenderTarget(reconnectSurface);\n',
              '                        if (conn != null && reconnectSurface != null) {\n'
              '                            if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n'
              '                                return;\n'
              '                            }\n'
              '                            decoderRenderer.setRenderTarget(reconnectSurface);\n',
              'reconnect start fence')

          replace_once(
              '                            Thread.sleep(2000);\n\n'
              '                            if (connected) {\n',
              '                            Thread.sleep(2000);\n'
              '                            if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n'
              '                                return;\n'
              '                            }\n\n'
              '                            if (connected) {\n',
              'reconnect post-start fence')

          replace_once(
              '                final boolean success = reconnected;\n'
              '                runOnUiThread(new Runnable() {\n'
              '                    @Override\n'
              '                    public void run() {\n',
              '                final boolean success = reconnected;\n'
              '                runOnUiThread(new Runnable() {\n'
              '                    @Override\n'
              '                    public void run() {\n'
              '                        if (!isSmartReconnectAttemptAllowed(reconnectToken)) {\n'
              '                            return;\n'
              '                        }\n',
              'reconnect final UI fence')

          replace_once(
              '    private void handleConnectionTerminatedFinal(final int errorCode) {\n',
              '    private boolean isSmartReconnectAttemptAllowed(int token) {\n'
              '        return smartReconnectFence.isCurrent(token) && !activityDestroyed && !isFinishing();\n'
              '    }\n\n'
              '    private void handleConnectionTerminatedFinal(final int errorCode) {\n'
              '        if (activityDestroyed || isFinishing()) {\n'
              '            return;\n'
              '        }\n',
              'reconnect lifecycle helper')

          path.write_text(text, encoding='utf-8')

      - name: Enforce lifecycle patch scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^app/src/main/java/com/limelight/Game\.java$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated changes: $unexpected" >&2
            exit 1
          fi
          starts="$(grep -c '^[[:space:]]*conn\.start(' app/src/main/java/com/limelight/Game.java)"
          marks="$(grep -c '^[[:space:]]*connecting = true;' app/src/main/java/com/limelight/Game.java)"
          if [[ "$starts" != "3" || "$marks" != "3" ]]; then
            echo "Expected exactly three connection starts and three connecting markers; got starts=$starts markers=$marks" >&2
            exit 1
          fi
          grep -F 'private volatile boolean connecting = false;' app/src/main/java/com/limelight/Game.java
          grep -F 'smartReconnectFence.cancel();' app/src/main/java/com/limelight/Game.java >/dev/null
          grep -F 'commitTextHandler.removeCallbacks(flushCommitTextQueue);' app/src/main/java/com/limelight/Game.java
          changed="$(git diff --numstat -- app/src/main/java/com/limelight/Game.java | awk '{print $1+$2}')"
          if (( changed > 120 )); then
            echo "Lifecycle patch unexpectedly large: ${changed} changed lines" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Compile and run lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac \
            :app:testNonRoot_gameDebugUnitTest \
            --tests com.limelight.SmartReconnectFenceTest \
            --tests com.limelight.GameActivityManifestTest \
            --tests com.limelight.SidewaysStreamModeTest \
            --stacktrace

      - name: Commit verified lifecycle patch and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lifecycle-reconnect-input-patch.yml
          git config user.name 'Artemis Plus Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/limelight/Game.java \
                  app/src/main/java/com/limelight/SmartReconnectFence.java \
                  app/src/test/java/com/limelight/SmartReconnectFenceTest.java \
                  .github/workflows/lifecycle-reconnect-input-patch.yml
          git diff --cached --check
          git commit -m 'Harden reconnect and queued input teardown [lifecycle-bot]'
          git push origin HEAD:fix/lifecycle-reconnect-input-teardown
