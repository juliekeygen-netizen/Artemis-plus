name: Sideways Stream Validate

on:
  push:
    branches:
      - feature/fake-portrait-sideways-poc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply fourth sideways stream audit patch
        run: python3 .github/sideways_stream_audit4.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile sideways stream branch
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run sideways and lifecycle regressions
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.SidewaysStreamModeTest"
          --tests "com.limelight.ArtemisOrientationHelperTest"
          --tests "com.limelight.ui.FloatingControlPositionStoreTest"
          --tests "com.limelight.GameActivityManifestTest"
          --tests "com.limelight.preferences.BackgroundStreamingPolicyTest"
          --tests "com.limelight.quickmenu.QuickMenuConfigTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LongPressMoveGestureGuardTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LayoutSnappingHelperTest"
          --stacktrace

      - name: Commit validated fourth-audit product patch
        run: |
          if git diff --quiet; then
            echo "No fourth-audit product patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/limelight/Game.java \
            app/src/main/java/com/limelight/SidewaysStreamMode.java \
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyBoardController.java \
            app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyBoardControllerConfigurationLoader.java \
            app/src/test/java/com/limelight/SidewaysStreamModeTest.java
          git commit -m "Fix sideways logical control bounds"
          git push
