name: Patch input grab restore lifecycle

on:
  push:
    branches:
      - fix/input-grab-restore-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Own delayed input grab restore
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/limelight/Game.java')
          text = path.read_text(encoding='utf-8')

          old = (
              "    private volatile boolean inputCallbacksDestroyed;\n"
              "\n"
              "    private final Runnable finishSecondScreenRunnable = () -> {\n"
          )
          new = (
              "    private volatile boolean inputCallbacksDestroyed;\n"
              "\n"
              "    private final Runnable restoreInputGrabRunnable = () -> {\n"
              "        if (inputCallbacksDestroyed || isFinishing() || isDestroyed() || !connected ||\n"
              "                keepAliveLifecycleArmed || keepAliveBackgrounded || keepAliveReturnPending ||\n"
              "                fastResumeLifecycleArmed || fastResumeBackgrounded || fastResumeReconnectPending) {\n"
              "            return;\n"
              "        }\n"
              "        setInputGrabState(true);\n"
              "    };\n"
              "\n"
              "    private void scheduleInputGrabRestore(long delayMs) {\n"
              "        if (timerHandler == null || inputCallbacksDestroyed) {\n"
              "            return;\n"
              "        }\n"
              "        timerHandler.removeCallbacks(restoreInputGrabRunnable);\n"
              "        timerHandler.postDelayed(restoreInputGrabRunnable, delayMs);\n"
              "    }\n"
              "\n"
              "    private final Runnable finishSecondScreenRunnable = () -> {\n"
          )
          if text.count(old) != 1:
              raise SystemExit('input callback field marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "    private void setInputGrabState(boolean grab) {\n"
              "        // Grab/ungrab the mouse cursor\n"
          )
          new = (
              "    private void setInputGrabState(boolean grab) {\n"
              "        // An explicit ungrab wins over any older delayed automatic re-grab. This also\n"
              "        // prevents a startup/foreground callback from re-enabling capture after we\n"
              "        // transition back to the background or the user manually releases input.\n"
              "        if (!grab && timerHandler != null) {\n"
              "            timerHandler.removeCallbacks(restoreInputGrabRunnable);\n"
              "        }\n"
              "\n"
              "        // Grab/ungrab the mouse cursor\n"
          )
          if text.count(old) != 1:
              raise SystemExit('setInputGrabState marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "        timerHandler.postDelayed(() -> {\n"
              "            if (!isFinishing() && connected) {\n"
              "                setInputGrabState(true);\n"
              "            }\n"
              "        }, 300);\n"
          )
          new = "        scheduleInputGrabRestore(300);\n"
          if text.count(old) != 1:
              raise SystemExit('Keep Alive input restore marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "                if (!connectedWhileKeepAliveBackgrounded) {\n"
              "                    timerHandler.postDelayed(new Runnable() {\n"
              "                        @Override\n"
              "                        public void run() {\n"
              "                            setInputGrabState(true);\n"
              "                        }\n"
              "                    }, 500);\n"
              "\n"
              "                    // Keep the display on while the stream is visible.\n"
          )
          new = (
              "                if (!connectedWhileKeepAliveBackgrounded) {\n"
              "                    scheduleInputGrabRestore(500);\n"
              "\n"
              "                    // Keep the display on while the stream is visible.\n"
          )
          if text.count(old) != 1:
              raise SystemExit('connectionStarted input restore marker mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit input grab restore patch
        run: |
          chmod +x app/src/main/java/com/limelight/Game.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/limelight/Game.java
          git diff --cached --check
          git commit -m "Own delayed input grab restore lifecycle"
          git push
