name: First patch validation

on:
  push:
    branches:
      - feature/first-patch-v4-orientation-settings-search
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-patch-v4-orientation-settings-search
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run first-patch and V4 regression tests
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.ArtemisOrientationHelperTest"
          --tests "com.limelight.OutsideStreamOrientationPolicyTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LayoutSnappingHelperTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LongPressMoveGestureGuardTest"
          --tests "com.limelight.ui.FloatingControlPositionStoreTest"
          --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-patch-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
