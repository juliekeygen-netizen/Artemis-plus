name: One-shot Fast Resume validation

on:
  push:
    branches:
      - feature/background-streaming-fast-resume
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/background-streaming-fast-resume
          fetch-depth: 0
          submodules: recursive

      - name: Apply Fast Resume patches
        run: |
          python3 .github/fast_resume_patch.py
          python3 .github/fast_resume_audit_patch.py
          python3 .github/fast_resume_surface_patch.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run Fast Resume and lifecycle regressions
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.preferences.BackgroundStreamingPolicyTest"
          --tests "com.limelight.preferences.StreamSettingsFragmentLifecycleTest"
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.PipAspectRatioHelperTest"
          --stacktrace

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: harden Fast Resume surface and input lifecycle"
          git push origin feature/background-streaming-fast-resume
