name: One-shot fix profile color v4

on:
  push:
    branches:
      - feature/key-profile-input-polish-v4
    paths:
      - .github/workflows/one-shot-fix-profile-color-v4.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix color literal and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesDialog.java')
          text = path.read_text(encoding='utf-8')
          old = 'roundedBackground(0x332FFFFFFF, 10 * density, 0, 0)'
          new = 'roundedBackground(0x33FFFFFF, 10 * density, 0, 0)'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one bad color literal, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesDialog.java
          git diff --cached --check
          git commit -m "fix: correct profile options backdrop color"
          git push origin HEAD:feature/key-profile-input-polish-v4
