name: One-shot external display listener cleanup

on:
  push:
    branches:
      - audit/lifecycle-hardening-3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/lifecycle-hardening-3
          fetch-depth: 0
          submodules: recursive

      - name: Apply listener teardown fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/limelight/Game.java')
          data = path.read_bytes()
          nl = '\r\n' if b'\r\n' in data else '\n'
          text = data.decode('utf-8').replace('\r\n', '\n')

          def replace_once(old, new):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit('anchor missing: ' + old[:160])
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique: {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    private boolean onExternelDisplay = false;\n    private ImageButton floatingMenuButton;''',
              '''    private boolean onExternelDisplay = false;\n    private DisplayManager externalDisplayManager;\n    private DisplayManager.DisplayListener externalDisplayListener;\n    private ImageButton floatingMenuButton;''')

          replace_once(
              '''    private void listenForExternalDisplayRemoval() {\n        DisplayManager displayManager = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);\n        displayManager.registerDisplayListener(new DisplayManager.DisplayListener() {\n            @Override\n            public void onDisplayAdded(int displayId) {\n            }\n\n            @Override\n            public void onDisplayRemoved(int displayId) {\n                if (getSecondaryDisplay(getBaseContext()) == null) {\n                    handleDisplayRemoved();\n                    finish();\n                }\n            }\n\n            @Override\n            public void onDisplayChanged(int displayId) {\n            }\n        }, null);\n    }''',
              '''    private void listenForExternalDisplayRemoval() {\n        if (externalDisplayListener != null) {\n            return;\n        }\n\n        externalDisplayManager = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);\n        externalDisplayListener = new DisplayManager.DisplayListener() {\n            @Override\n            public void onDisplayAdded(int displayId) {\n            }\n\n            @Override\n            public void onDisplayRemoved(int displayId) {\n                if (getSecondaryDisplay(getBaseContext()) == null) {\n                    handleDisplayRemoved();\n                    finish();\n                }\n            }\n\n            @Override\n            public void onDisplayChanged(int displayId) {\n            }\n        };\n        externalDisplayManager.registerDisplayListener(externalDisplayListener, null);\n    }\n\n    private void stopListeningForExternalDisplayRemoval() {\n        if (externalDisplayManager != null && externalDisplayListener != null) {\n            try {\n                externalDisplayManager.unregisterDisplayListener(externalDisplayListener);\n            } catch (IllegalArgumentException ignored) {\n                // Already unregistered by the platform or another teardown path.\n            }\n        }\n        externalDisplayListener = null;\n        externalDisplayManager = null;\n    }''')

          replace_once(
              '''        timerHandler.removeCallbacksAndMessages(null);\n\n        if (prefConfig.enableFullExDisplay) handleDisplayRemoved();''',
              '''        timerHandler.removeCallbacksAndMessages(null);\n        stopListeningForExternalDisplayRemoval();\n\n        if (prefConfig.enableFullExDisplay) handleDisplayRemoved();''')

          path.write_bytes(text.replace('\n', nl).encode('utf-8'))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run lifecycle regressions
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.preferences.StreamSettingsFragmentLifecycleTest"
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --stacktrace

      - name: Commit verified product fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/Game.java
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: unregister external display listener on teardown"
          git push origin audit/lifecycle-hardening-3
