name: Patch Game connection callback lifecycle

on:
  push:
    branches:
      - fix/game-connection-callback-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard performance callback UI work after teardown
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/limelight/Game.java')
          text = path.read_text(encoding='utf-8')

          old = (
              "    @Override\n"
              "    public void onPerfUpdate(final String text) {\n"
              "        runOnUiThread(new Runnable() {\n"
          )
          new = (
              "    @Override\n"
              "    public void onPerfUpdate(final String text) {\n"
              "        runOnUiThreadIfActive(new Runnable() {\n"
          )
          if text.count(old) != 1:
              raise SystemExit('onPerfUpdate marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "    public void onPerfStatsUpdate(final float decodeTimeMs, final float renderTimeMs,\n"
              "                                  final float networkLatencyMs, final int fps, final String codec) {\n"
              "        runOnUiThread(new Runnable() {\n"
          )
          new = (
              "    public void onPerfStatsUpdate(final float decodeTimeMs, final float renderTimeMs,\n"
              "                                  final float networkLatencyMs, final int fps, final String codec) {\n"
              "        runOnUiThreadIfActive(new Runnable() {\n"
          )
          if text.count(old) != 1:
              raise SystemExit('onPerfStatsUpdate marker mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit performance callback lifecycle patch
        run: |
          chmod +x app/src/main/java/com/limelight/Game.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/limelight/Game.java
          git diff --cached --check
          git commit -m "Guard Game performance callbacks after teardown"
          git push
