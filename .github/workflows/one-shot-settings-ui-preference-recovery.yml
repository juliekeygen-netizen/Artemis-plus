name: One-shot settings UI preference recovery patch

on:
  push:
    branches:
      - fix/settings-ui-preference-type-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'juliekeygen-netizen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/settings-ui-preference-type-recovery

      - name: Apply exact patch
        run: python3 .github/patch-settings-ui-preference-recovery.py

      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git diff --check
          git diff -- app/src/main/java/com/limelight/preferences/StreamSettings.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/limelight/preferences/StreamSettings.java
          git commit -m 'fix: recover settings UI preference types'
          git push origin HEAD:fix/settings-ui-preference-type-recovery
