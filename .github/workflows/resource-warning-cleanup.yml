name: Resource warning cleanup

on:
  push:
    branches:
      - audit/resource-warning-cleanup

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[bot-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply guarded resource cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          orphan_names = [
              'category_perf_charts',
              'desc_chart_decode',
              'desc_chart_fps',
              'desc_chart_latency',
              'summary_enable_perf_charts',
              'summary_perf_chart_decode',
              'summary_perf_chart_fps',
              'summary_perf_chart_latency',
              'title_enable_perf_charts',
              'title_perf_chart_decode',
              'title_perf_chart_fps',
              'title_perf_chart_latency',
          ]

          # These resources belonged to the retired Performance Charts UI. Fail closed if any
          # current Java/Kotlin/default-resource/settings code still references them.
          for name in orphan_names:
              unexpected = []
              for path in (root / 'app/src/main').rglob('*'):
                  if not path.is_file() or path.suffix not in {'.java', '.kt', '.xml'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if name not in text:
                      continue
                  normalized = path.as_posix()
                  declaration_only = '/res/values-' in ('/' + normalized) and re.search(
                      rf'<string\s+name="{re.escape(name)}"(?:\s|>)', text)
                  if not declaration_only:
                      unexpected.append(normalized)
              if unexpected:
                  raise SystemExit(f'{name} still has live/non-locale references: {unexpected}')

          removed = {name: 0 for name in orphan_names}
          for path in (root / 'app/src/main/res').glob('values-*/*.xml'):
              text = path.read_text(encoding='utf-8')
              original = text
              for name in orphan_names:
                  pattern = re.compile(
                      rf'^[ \t]*<string\s+name="{re.escape(name)}"(?:\s+[^>]*)?>.*?</string>[ \t]*(?:\r?\n)?',
                      re.MULTILINE | re.DOTALL)
                  text, count = pattern.subn('', text)
                  removed[name] += count
              if text != original:
                  path.write_text(text, encoding='utf-8', newline='')

          missing = [name for name, count in removed.items() if count == 0]
          if missing:
              raise SystemExit(f'Expected orphan resource declarations were not found: {missing}')
          print('Removed retired Performance Charts locale declarations:', removed)

          static_summary = 'title_render_mode_balance_shift_description'
          for relative in [
              'app/src/main/res/values-ru/strings.xml',
              'app/src/main/res/values-zh-rCN/strings.xml',
              'app/src/main/res/values-zh-rTW/strings.xml',
          ]:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              old = f'<string name="{static_summary}">'
              new = f'<string name="{static_summary}" formatted="false">'
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one unformatted {static_summary} in {relative}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
              print('Marked static percent-bearing summary non-formatted:', relative)

      - name: Check patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo 'Changed files:'
          git diff --name-only
          unexpected="$(git diff --name-only | grep -Ev '^app/src/main/res/values-[^/]+/[^/]+\.xml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected file changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install SDK and NDK
        shell: bash
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Verify Android resources and compilation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:processNonRoot_gameDebugResources :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace 2>&1 | tee /tmp/resource-build.log
          for name in \
            category_perf_charts desc_chart_decode desc_chart_fps desc_chart_latency \
            summary_enable_perf_charts summary_perf_chart_decode summary_perf_chart_fps summary_perf_chart_latency \
            title_enable_perf_charts title_perf_chart_decode title_perf_chart_fps title_perf_chart_latency; do
            if grep -F "removing resource com.limelight.noirdebug:string/${name} without required default value" /tmp/resource-build.log; then
              echo "Stale missing-default warning remains for ${name}" >&2
              exit 1
            fi
          done
          if grep -F 'title_render_mode_balance_shift_description' /tmp/resource-build.log | grep -F 'multiple substitutions' >/dev/null; then
            echo 'Static percent summary formatting warning remains.' >&2
            exit 1
          fi

      - name: Commit verified cleanup and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resource-warning-cleanup.yml
          git config user.name 'Artemis Plus Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/res .github/workflows/resource-warning-cleanup.yml
          git diff --cached --check
          git commit -m 'Clean stale Android resource warnings [bot-patch]'
          git push origin HEAD:audit/resource-warning-cleanup
