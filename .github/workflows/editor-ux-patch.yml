name: One-shot Editor UX Patch

on:
  push:
    branches:
      - feature/keyboard-editor-ux-input-fix
    paths:
      - .github/workflows/editor-ux-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/keyboard-editor-ux-input-fix
          fetch-depth: 0

      - name: Fix profile menu backdrop literal
        run: sed -i 's/0x332FFFFFFF/0x33FFFFFF/' app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesDialog.java

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesDialog.java
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: correct profile menu backdrop color"
          git push origin HEAD:feature/keyboard-editor-ux-input-fix
