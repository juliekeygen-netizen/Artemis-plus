name: Android CI

on:
  push:
    branches:
      - main
      - feature/diana-osc-port
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile non-root debug variant
        run: ./gradlew :app:compileNonRoot_gameDebugJavaWithJavac --stacktrace

      - name: Run Artemis Plus regression tests
        run: >-
          ./gradlew :app:testNonRoot_gameDebugUnitTest
          --tests "com.limelight.ArtemisOrientationHelperTest"
          --tests "com.limelight.OutsideStreamOrientationPolicyTest"
          --tests "com.limelight.BottomEdgeStartGestureDetectorTest"
          --tests "com.limelight.PipOverlayTransitionStateTest"
          --tests "com.limelight.PipAspectRatioHelperTest"
          --tests "com.limelight.binding.input.virtual_controller.OscProfilesManagerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.ArtemisActionButtonFactoryTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.KeyComboManagerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.KeyboardProfilesManagerTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LayoutSnappingHelperTest"
          --tests "com.limelight.binding.input.virtual_controller.keyboard.LongPressMoveGestureGuardTest"
          --tests "com.limelight.nvstream.http.PairingManagerRetryTest"
          --tests "com.limelight.ui.FloatingControlPositionStoreTest"
          --tests "com.limelight.preferences.BackgroundStreamingPolicyTest"
          --tests "com.limelight.GameActivityManifestTest"
          --tests "com.limelight.preferences.StreamSettingsFragmentLifecycleTest"
          --stacktrace

      - name: Run full inherited unit suite (diagnostic)
        id: inherited_tests
        continue-on-error: true
        run: ./gradlew :app:testNonRoot_gameDebugUnitTest --stacktrace

      - name: Note inherited baseline failures
        if: steps.inherited_tests.outcome == 'failure'
        run: |
          echo "The inherited Artemis/Marssvoodoo test baseline currently contains known Robolectric failures."
          echo "These same failures were reproduced from the pre-OSC base commit f5587a81d73bf2501b68f1e5a48ca736aa5520a2."
          echo "See the uploaded full test report for details."

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
