name: Repair pointer capture source bytes

on:
  push:
    branches:
      - fix/native-pointer-capture-lifecycle

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preserve CRLF and clean comment indentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/limelight/binding/input/capture/AndroidNativePointerCaptureProvider.java')
          data = path.read_bytes()
          old = b'\r\n         // and re-enter this callback.\r\n'
          new = b'\r\n        // and re-enter this callback.\r\n'
          if old not in data:
              raise SystemExit('Expected CRLF comment pattern not found')
          data = data.replace(old, new, 1)
          if b'\r\n' not in data or data.replace(b'\r\n', b'').find(b'\n') != -1:
              raise SystemExit('Line ending preservation check failed')
          path.write_bytes(data)

      - name: Commit repair
        run: |
          chmod +x app/src/main/java/com/limelight/binding/input/capture/AndroidNativePointerCaptureProvider.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/limelight/binding/input/capture/AndroidNativePointerCaptureProvider.java
          git diff --cached --check
          git commit -m "Clean pointer capture source metadata"
          git push
