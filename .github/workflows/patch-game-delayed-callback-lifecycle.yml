name: Patch Game delayed callback lifecycle

on:
  push:
    branches:
      - fix/game-delayed-callback-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bind delayed Game callbacks to Activity teardown
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/limelight/Game.java')
          text = path.read_text(encoding='utf-8')

          old = (
              "    private final Runnable flushCommitTextQueue = new Runnable() {\n"
          )
          new = (
              "    private final Runnable finishSecondScreenRunnable = () -> {\n"
              "        if (inputCallbacksDestroyed || isFinishing() || isDestroyed()) {\n"
              "            return;\n"
              "        }\n"
              "        finish();\n"
              "    };\n"
              "\n"
              "    private final Runnable flushCommitTextQueue = new Runnable() {\n"
          )
          if text.count(old) != 1:
              raise SystemExit('flushCommitTextQueue insertion marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "    private final Runnable toggleGrab = new Runnable() {\n"
              "        @Override\n"
              "        public void run() {\n"
              "            setInputGrabState(!grabbedInput);\n"
              "        }\n"
              "    };\n"
          )
          new = (
              "    private final Runnable toggleGrab = new Runnable() {\n"
              "        @Override\n"
              "        public void run() {\n"
              "            if (inputCallbacksDestroyed || isFinishing() || isDestroyed()) {\n"
              "                return;\n"
              "            }\n"
              "            setInputGrabState(!grabbedInput);\n"
              "        }\n"
              "    };\n"
          )
          if text.count(old) != 1:
              raise SystemExit('toggleGrab runnable marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "    @SuppressLint(\"InlinedApi\")\n"
              "    private final Runnable hideSystemUi = new Runnable() {\n"
              "        @Override\n"
              "        public void run() {\n"
              "            // TODO: Do we want to use WindowInsetsController here on R+ instead of\n"
          )
          new = (
              "    @SuppressLint(\"InlinedApi\")\n"
              "    private final Runnable hideSystemUi = new Runnable() {\n"
              "        @Override\n"
              "        public void run() {\n"
              "            if (inputCallbacksDestroyed || isFinishing() || isDestroyed()) {\n"
              "                return;\n"
              "            }\n"
              "\n"
              "            // TODO: Do we want to use WindowInsetsController here on R+ instead of\n"
          )
          if text.count(old) != 1:
              raise SystemExit('hideSystemUi runnable marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "    private void hideSystemUi(int delay) {\n"
              "        Handler h = getWindow().getDecorView().getHandler();\n"
              "        if (h != null) {\n"
              "            h.removeCallbacks(hideSystemUi);\n"
              "            h.postDelayed(hideSystemUi, delay);\n"
              "        }\n"
              "    }\n"
          )
          new = (
              "    private void hideSystemUi(int delay) {\n"
              "        if (timerHandler != null && !inputCallbacksDestroyed) {\n"
              "            timerHandler.removeCallbacks(hideSystemUi);\n"
              "            timerHandler.postDelayed(hideSystemUi, delay);\n"
              "        }\n"
              "    }\n"
          )
          if text.count(old) != 1:
              raise SystemExit('hideSystemUi scheduler marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "                    case KeyEvent.KEYCODE_Z:\n"
              "                        Handler h = getWindow().getDecorView().getHandler();\n"
              "                        if (h != null) {\n"
              "                            h.postDelayed(toggleGrab, 250);\n"
              "                        }\n"
              "                        break;\n"
          )
          new = (
              "                    case KeyEvent.KEYCODE_Z:\n"
              "                        if (timerHandler != null && !inputCallbacksDestroyed) {\n"
              "                            timerHandler.removeCallbacks(toggleGrab);\n"
              "                            timerHandler.postDelayed(toggleGrab, 250);\n"
              "                        }\n"
              "                        break;\n"
          )
          if text.count(old) != 1:
              raise SystemExit('toggleGrab scheduler marker mismatch')
          text = text.replace(old, new, 1)

          old = (
              "    private void finishSecondScreen() {\n"
              "        // Otherwise screen stays connected but not working with no way of quitting it\n"
              "        if (prefConfig.enableFullExDisplay) {\n"
              "            Handler h = new Handler();\n"
              "            h.postDelayed(new Runnable() {\n"
              "                @Override\n"
              "                public void run() {\n"
              "                    finish();\n"
              "                }\n"
              "            }, 2000);\n"
              "        }\n"
              "    }\n"
          )
          new = (
              "    private void finishSecondScreen() {\n"
              "        // Otherwise screen stays connected but not working with no way of quitting it\n"
              "        if (prefConfig.enableFullExDisplay && timerHandler != null && !inputCallbacksDestroyed) {\n"
              "            timerHandler.removeCallbacks(finishSecondScreenRunnable);\n"
              "            timerHandler.postDelayed(finishSecondScreenRunnable, 2000);\n"
              "        }\n"
              "    }\n"
          )
          if text.count(old) != 1:
              raise SystemExit('finishSecondScreen marker mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit Game lifecycle patch
        run: |
          chmod +x app/src/main/java/com/limelight/Game.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/limelight/Game.java
          git diff --cached --check
          git commit -m "Own delayed Game callbacks across teardown"
          git push
