name: One-shot keyboard profile storage alias patch

on:
  push:
    branches:
      - fix/keyboard-profile-storage-alias-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'juliekeygen-netizen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/keyboard-profile-storage-alias-recovery

      - name: Apply exact patch
        run: python3 .github/patch-keyboard-profile-storage-alias.py

      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesManager.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/limelight/binding/input/virtual_controller/keyboard/KeyboardProfilesManager.java
          git commit -m 'fix: reject keyboard profile storage aliases'
          git push origin HEAD:fix/keyboard-profile-storage-alias-recovery
