name: One-shot first patch

on:
  push:
    branches:
      - feature/first-patch-v4-orientation-settings-search
    paths:
      - '.github/workflows/one-shot-first-patch.yml'
      - 'tools/one_shot_first_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-patch-v4-orientation-settings-search
          fetch-depth: 0
          submodules: recursive

      - name: Apply first patch
        run: python3 tools/one_shot_first_patch.py

      - name: Commit generated product and tests
        run: |
          # The GitHub Actions token cannot modify workflow files. Keep the product/test changes,
          # but leave Android CI itself untouched; the full inherited suite already executes the
          # newly added tests and we will inspect that run explicitly before promotion.
          git checkout -- .github/workflows/android-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: harden v4 and add outside orientation and settings search"
          git push origin HEAD:feature/first-patch-v4-orientation-settings-search
